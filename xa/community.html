<!DOCTYPE html>
<html class="light" lang="zh-TW">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>社群中心 - 劍嘯笑傲</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/global.css">
</head>

<body class="bg-surface text-on-surface font-body min-h-screen relative overflow-x-hidden pt-24 bg-ink-pattern">
    <!-- Navbar Placeholder -->
    <nav id="main-nav"></nav>

    <main class="max-w-screen-xl mx-auto px-6 py-24 flex flex-col gap-24">
        <header class="text-center">
            <h1 class="font-headline text-5xl md:text-7xl font-black text-on-surface mb-4 italic">社群中心</h1>
            <p class="text-on-surface-variant font-label text-xl tracking-widest max-w-2xl mx-auto">
                結交五湖四海的朋友，分享您的俠隱日常。
            </p>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Facebook -->
            <a href="#" class="group bg-surface-container-high p-10 rounded-2xl flex flex-col items-center gap-6 hover:bg-primary hover:text-on-primary transition-all duration-300 transform hover:-translate-y-2 border border-outline-variant/10">
                <span class="material-symbols-outlined text-6xl group-hover:scale-110 transition-transform">facebook</span>
                <span class="font-headline text-2xl font-bold">Facebook</span>
            </a>

            <!-- Discord -->
            <a href="#" class="group bg-surface-container-high p-10 rounded-2xl flex flex-col items-center gap-6 hover:bg-[#5865F2] hover:text-on-primary transition-all duration-300 transform hover:-translate-y-2 border border-outline-variant/10">
                <span class="material-symbols-outlined text-6xl group-hover:scale-110 transition-transform">forum</span>
                <span class="font-headline text-2xl font-bold">Discord</span>
            </a>

            <!-- Instagram -->
            <a href="#" class="group bg-surface-container-high p-10 rounded-2xl flex flex-col items-center gap-6 hover:bg-gradient-to-tr hover:from-[#f9ce34] hover:to-[#ee2a7b] hover:text-on-primary transition-all duration-300 transform hover:-translate-y-2 border border-outline-variant/10">
                <span class="material-symbols-outlined text-6xl group-hover:scale-110 transition-transform">photo_camera</span>
                <span class="font-headline text-2xl font-bold">Instagram</span>
            </a>

            <!-- Official Forum -->
            <a href="#" class="group bg-surface-container-high p-10 rounded-2xl flex flex-col items-center gap-6 hover:bg-secondary hover:text-on-secondary transition-all duration-300 transform hover:-translate-y-2 border border-outline-variant/10">
                <span class="material-symbols-outlined text-6xl group-hover:scale-110 transition-transform">article</span>
                <span class="font-headline text-2xl font-bold">官方論壇</span>
            </a>
        </section>

        <!-- Social Feed Simulation -->
        <section class="bg-surface-container-low rounded-3xl p-12 border border-outline-variant/30 relative overflow-hidden">
             <div class="absolute top-0 right-0 p-8 opacity-5">
                 <span class="material-symbols-outlined text-[200px]" style="font-variation-settings: 'FILL' 1;">groups</span>
             </div>
             <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-12">
                 <div class="flex-1">
                     <h2 class="font-headline text-4xl font-bold mb-6 text-on-surface">大俠討論區</h2>
                     <p class="text-on-surface-variant text-lg leading-relaxed font-label mb-8">
                         在這裡，您可以討論門派攻略、分享絕世神兵的洗煉心得，或是懸賞那殺千刀的江洋大盜。
                     </p>
                     <button class="bg-primary text-on-primary font-bold px-10 py-4 btn-brushstroke shadow-xl hover:opacity-90">進入討論</button>
                 </div>
                 <div class="w-full md:w-80 h-80 bg-surface-container-low rounded-full border-8 border-surface-container-highest flex items-center justify-center relative overflow-hidden">
                      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPb0ZnO_9m2KE5wr5EX4dz1ZVLBYNT9wCeUXGeF29bFFwCmWUMiPBTa7BtrenCNBYKd0H_K5Ulrm6YFcVXfn6-2_IRN-XBJgx7WDhq40SuBTn8wzx851Re0lvWMv8PCwvCymexHHOyGaBEkhZp_a4PQe7o2zcNdGJOsye3erf9j9M5GYvj8N5mbQR0nX-Z2g9y5QvMHVKHwU8tG2AhVuL7pfq1RW2TqkVfD10u-nikWxThUG-2HJREz0qgatf6eEXEQ03wmgt8EVw" class="w-full h-full object-cover">
                 </div>
             </div>
        </section>
    </main>

    <!-- Footer Placeholder -->
    <footer id="main-footer"></footer>

    <!-- Modular Scripts -->
    <script src="js/components/navbar.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
