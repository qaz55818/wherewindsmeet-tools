<!DOCTYPE html>

<head>

    <!-- Tailwind & Config -->

    <!-- Fonts & Icons -->

            <h1 class="text-7xl md:text-9xl font-black font-headline text-on-surface mb-6 tracking-tight drop-shadow-[0_4px_12px_rgba(30,27,18,0.1)]">
                劍嘯笑傲
            </h1>
            <p class="text-xl md:text-2xl text-on-surface-variant font-headline font-medium mb-12 max-w-2xl mx-auto leading-relaxed">
                一劍霜寒十四州，笑傲江湖任逍遙。<br />畫卷徐開，靜候君臨。</p>
            <div class="flex flex-col sm:flex-row gap-6 items-center justify-center">
                <button class="bg-primary text-on-primary font-headline text-xl px-12 py-5 btn-brushstroke hover:bg-gradient-to-r hover:from-primary hover:to-primary-container transition-all duration-300 shadow-[0_12px_30px_-10px_rgba(57,0,3,0.5)] transform hover:-translate-y-1">
                    立即下載
                </button>
                <button class="relative text-on-surface font-label text-lg px-8 py-4 group">
                    <span class="relative z-10">觀看預告</span>
                    <div class="absolute bottom-2 left-0 w-full h-[2px] bg-primary/20 group-hover:bg-primary transition-colors"></div>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="relative z-10 px-4 sm:px-8 lg:px-16 py-24 max-w-screen-2xl mx-auto flex flex-col gap-32">
        <!-- News Section -->
        <section class="flex flex-col gap-12">
            <div class="flex flex-col md:flex-row justify-between items-end gap-6 border-b border-surface-container-high pb-4">
                <div>
                    <h2 class="text-4xl font-headline font-bold text-on-surface mb-2">江湖快報</h2>
                    <p class="text-on-surface-variant font-label">江湖傳記</p>
                </div>
                <div class="flex gap-8 font-headline text-lg">
                    <button class="text-primary font-bold relative after:content-[''] after:absolute after:-bottom-[18px] after:left-0 after:w-full after:h-[2px] after:bg-primary">最新</button>
                    <button class="text-on-surface-variant hover:text-on-surface transition-colors relative after:content-[''] after:absolute after:-bottom-[18px] after:left-0 after:w-0 after:h-[2px] after:bg-primary hover:after:w-full after:transition-all after:duration-300">新聞</button>
                    <button class="text-on-surface-variant hover:text-on-surface transition-colors relative after:content-[''] after:absolute after:-bottom-[18px] after:left-0 after:w-0 after:h-[2px] after:bg-primary hover:after:w-full after:transition-all after:duration-300">活動</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-8 auto-rows-[minmax(200px,auto)]">
                <div class="md:col-span-8 md:row-span-2 bg-surface-container-high p-8 flex flex-col justify-end relative overflow-hidden group cursor-pointer shadow-[0_20px_40px_-15px_rgba(30,27,18,0.06)] hover:shadow-[0_24px_50px_-15px_rgba(30,27,18,0.1)] transition-shadow duration-500">

                    <div class="absolute inset-0 bg-gradient-to-t from-surface-container-low via-surface-container-low/80 to-transparent"></div>
                    <div class="relative z-10 mt-32">
                        <span class="inline-block bg-primary text-on-primary text-xs font-bold px-3 py-1 mb-4 btn-brushstroke">公告</span>
                        <h3 class="text-3xl font-headline font-bold text-on-surface mb-3 group-hover:text-primary transition-colors">《劍嘯笑傲》全新資料片「風起隴西」今日震撼上線！</h3>
                        <p class="text-on-surface-variant font-label line-clamp-2 max-w-2xl">全新門派「唐門」現世，百步穿楊，暗器無雙。體驗全新主線劇情，結交各路英雄豪傑，更有豐富開服活動等你來參與。</p>
                        <div class="mt-6 text-on-surface-variant font-label text-sm flex items-center gap-2">
                            <span class="material-symbols-outlined text-[16px]">schedule</span> 2024.10.24
                        </div>
                    </div>
                </div>
                <div class="md:col-span-4 bg-surface-container flex flex-col p-6 group cursor-pointer hover:bg-surface-container-high transition-colors text-article">
                    <span class="text-primary text-sm font-bold mb-2">活動</span>
                    <h3 class="text-xl font-headline font-medium text-on-surface mb-2 group-hover:text-primary transition-colors">「風起隴西」簽到送好禮，絕版坐騎等你拿</h3>
                    <div class="mt-auto pt-4 flex justify-between items-center text-on-surface-variant font-label text-xs">
                        <span>2024.10.23</span>
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </div>
                </div>
                <div class="md:col-span-4 bg-surface-container flex flex-col p-6 group cursor-pointer hover:bg-surface-container-high transition-colors text-article">
                    <span class="text-secondary text-sm font-bold mb-2">新聞</span>
                    <h3 class="text-xl font-headline font-medium text-on-surface mb-2 group-hover:text-primary transition-colors">伺服器優化與異常修復公告 (10/22)</h3>
                    <div class="mt-auto pt-4 flex justify-between items-center text-on-surface-variant font-label text-xs">
                        <span>2024.10.22</span>
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </div>
                </div>
            </div>
            <div class="flex justify-center mt-4">
                <button class="text-on-surface font-headline font-medium px-8 py-3 border border-outline-variant/30 hover:border-primary hover:text-primary transition-all rounded-sm flex items-center gap-2">查看更多
                    <span class="material-symbols-outlined text-sm">east</span></button>
            </div>
        </section>
    </main>

    <!-- Footer (Modular) -->
    <footer id="main-footer"></footer>

    <!-- Scripts (Modularized fallback for file:// support) -->
    <script src="js/components/navbar.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
