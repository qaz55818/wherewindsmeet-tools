            {

                    { title: "鏟子洞穴入口", code: "goto -532 197 124", desc: "鏟子本體: -429 137 -103" },
                    { title: "黃金甲洞口1", code: "goto -538 285 -634", desc: "黃金甲本體: 187 139 -666" },
                    { title: "鎬洞穴出口", code: "goto 1487 79 746", desc: "鎬本體: 1417 80 734" },
                    { title: "結局洞口", code: "goto 1756 42 553", desc: "豪華地堡" },
                    { title: "神器1", code: "goto -624 -22 1398", desc: "潛水器洞穴內" },
                    { title: "神器2", code: "goto -1082 87 -131", desc: "繩索槍洞穴內" },
                    { title: "神器3", code: "goto -410 206 -880", desc: "" },
                    { title: "神器4", code: "goto 1287 48 646", desc: "" },
                    { title: "神器5", code: "goto 1725 -30 1050", desc: "木屋下索拉菲特礦坑內" },
                    { title: "全地圖最高點", code: "goto 202 738 144", desc: "雪山山巔" }
                ]
            }
        ];

        const navContainer = document.getElementById('categoryNav');
        const dataContainer = document.getElementById('dataContainer');
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('emptyState');
        const currentCategoryText = document.getElementById('currentCategoryText');
        const entryCount = document.getElementById('entryCount');
        const toastContainer = document.getElementById('toastContainer');

        let activeCategoryId = database[0].id;

        const categoryIcons = {
            "player": "person",
            "companion": "group",
            "world": "public",
            "spawn_enemy": "pest_control",
            "spawn_animal": "pets",
            "items": "category",
            "ui_system": "settings_system_daydream",
            "coordinates": "explore"
        };

        // Init Build
        function init() {
            buildNavigation();
            renderContent();
            setupSearch();
        }

        function buildNavigation() {
            navContainer.innerHTML = '';
            database.forEach(cat => {
                const btn = document.createElement('button');
                const icon = categoryIcons[cat.id] || "folder";
                btn.className = `w-full text-left px-5 py-4 font-bold uppercase tracking-wider text-sm transition-all rounded-2xl flex justify-between items-center group mb-2
                    ${activeCategoryId === cat.id 
                        ? 'bg-gradient-to-r from-term-pink/20 to-term-purple/20 text-slate-800 shadow-sm border border-term-pink/50' 
                        : 'border border-transparent text-slate-600 hover:bg-white/50 hover:text-slate-800 hover:border-white/60'}`;
                
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-xl ${activeCategoryId === cat.id ? 'text-term-pink' : 'text-slate-500 group-hover:text-term-pink transition-colors'}">${icon}</span>
                        <span>${cat.name}</span>
                    </div>
                    <span class="text-xs font-mono font-bold py-1 px-2 rounded-full ${activeCategoryId === cat.id ? 'bg-term-purple/20 text-term-purple' : 'bg-white/60 text-slate-500 group-hover:bg-white/80 group-hover:text-term-pink border border-white'}">${cat.items.length}</span>
                `;
                
                btn.onclick = () => {
                    activeCategoryId = cat.id;
                    searchInput.value = ''; // clear search on cat change
                    buildNavigation();
                    renderContent();
                    
                    // Mobile behavior: Scroll to content
                    if(window.innerWidth < 768) {
                         document.querySelector('main').scrollIntoView({ behavior: 'smooth' });
                    }
                };
                navContainer.appendChild(btn);
            });
        }

        function renderContent(searchQuery = '') {
            dataContainer.innerHTML = '';
            let totalRendered = 0;
            let categoriesToRender = [];

            if (searchQuery) {
                // Filter mode: Search across all categories
                const q = searchQuery.toLowerCase();
                categoriesToRender = database.map(cat => {
                    return {
                        ...cat,
                        items: cat.items.filter(item => 
                            item.title.toLowerCase().includes(q) || 
                            item.code.toLowerCase().includes(q) || 
                            (item.desc && item.desc.toLowerCase().includes(q))
                        )
                    }
                }).filter(cat => cat.items.length > 0);
                
                currentCategoryText.innerText = "SYS.SEARCH_RESULTS ✧";
            } else {
                // Normal mode: Show active category
                categoriesToRender = database.filter(cat => cat.id === activeCategoryId);
                const activeCatData = database.find(c => c.id === activeCategoryId);
                currentCategoryText.innerText = `DIR // ${activeCatData.name} ✧`;
            }

            if (categoriesToRender.length === 0) {
                emptyState.classList.remove('hidden');
                dataContainer.classList.add('hidden');
                entryCount.innerText = '0';
                return;
            }

            emptyState.classList.add('hidden');
            dataContainer.classList.remove('hidden');

            categoriesToRender.forEach(cat => {
                // Add Section Header if searching (to show context)
                if(searchQuery) {
                     const header = document.createElement('h2');
                     header.className = "text-xl font-bold text-slate-800 border-b border-term-pink/30 pb-3 mt-10 mb-6 uppercase tracking-widest flex items-center gap-2";
                     header.innerHTML = `<span class="material-symbols-outlined text-term-pink">auto_awesome</span> [ ${cat.name} ]`;
                     dataContainer.appendChild(header);
                } else {
                     const descBox = document.createElement('div');
                     descBox.className = "bg-white/60 border border-term-pink/30 rounded-2xl p-4 mb-8 flex items-start gap-3 shadow-sm relative overflow-hidden";
                     descBox.innerHTML = `
                        <img src="https://lh3.googleusercontent.com/aida/AP1WRLs5nhtNRkhURm4dSV5Kto9sqPBB5EiXR3_c4ljvyrhF290lb_lcLXFLXLSTOM2jCA1xCcEPJ-cAs7O6BdC8MfVVquWvD5kYWmQUwXiaPCUZlCjCF8dmzPhj-l8okp7svx5gQc6yIpysZrSkyeDz6UP_yMCzmnVJdTNNrIECnRP6ub-K5FJhYBHMGMlRKN6WmYSj5cw5V_HReeqF9uGN6MOexEkfFmN9KfQlqYWL6W3HnD1VuqbZhjAQz5Cn" class="absolute -right-2 -bottom-2 w-16 h-16 opacity-30 transform -rotate-12 object-contain drop-shadow-sm">
                        <span class="material-symbols-outlined text-term-pink mt-0.5 relative z-10">info</span>
                        <p class="text-sm font-mono text-slate-700 font-bold relative z-10">${cat.desc}</p>
                     `;
                     dataContainer.appendChild(descBox);
                }

                // Grid for items
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 xl:grid-cols-2 gap-6";

                cat.items.forEach(item => {
                    totalRendered++;
                    const card = document.createElement('div');
                    card.className = "group glass-panel gradient-border p-6 hover:shadow-card-hover transition-all duration-300 flex flex-col justify-between bg-white/50";
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="font-bold text-xl text-slate-800 tracking-wide flex items-center gap-2">
                                    ${item.title}
                                </h3>
                                <span class="material-symbols-outlined text-term-pink/40 group-hover:text-term-pink transition-colors text-lg">star</span>
                            </div>
                            <div class="bg-white/70 rounded-xl border border-term-pink/20 p-4 font-mono text-sm text-term-purple mb-4 break-all shadow-sm relative overflow-hidden group-hover:border-term-pink/50 transition-colors">
                                <div class="absolute inset-0 bg-gradient-to-r from-term-pink/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <span class="relative z-10 font-bold">${item.code}</span>
                            </div>
                            ${item.desc ? `<p class="font-sans font-semibold text-sm text-slate-600 leading-relaxed mb-4">${item.desc}</p>` : ''}
                        </div>
                        <div class="mt-2 flex justify-end">
                            <button onclick="copyToClipboard('${item.code.replace(/'/g, "\\'")}')" 
                                    class="bg-white/80 hover:bg-gradient-to-r hover:from-term-pink hover:to-term-purple border border-term-pink/30 hover:border-transparent text-slate-700 hover:text-white rounded-full px-5 py-2 text-xs font-bold tracking-widest transition-all duration-300 flex items-center gap-2 shadow-sm hover:shadow-neon-pink">
                                <span class="material-symbols-outlined text-[16px]">content_copy</span>
                                <span>COPY</span>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                dataContainer.appendChild(grid);
            });

            entryCount.innerText = totalRendered;
        }

        function setupSearch() {
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                renderContent(query);
            });
        }

        function copyToClipboard(text) {
            // Modern Clipboard API fallback
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast(text));
            } else {
                // Fallback for older browsers or non-secure contexts (like some iframes)
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(text);
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                textArea.remove();
            }
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'toast-enter bg-gradient-to-r from-term-pink via-term-purple to-term-green p-[2px] rounded-2xl shadow-neon-purple w-max max-w-[90vw]';
            toast.innerHTML = `
                <div class="bg-white/95 rounded-2xl px-5 py-4 flex items-center gap-4 relative overflow-hidden backdrop-blur-md">
                    <img src="https://lh3.googleusercontent.com/aida/AP1WRLt76QLxmitivX9fpgJ3fmGJvUm6gB3EPig3WwOSmIshCvoOhRSqCaFFphmamvIIXBW5ibKPT2j9TX9agdmxOekQyWFbAPg9GnGu6eq8pPnwSBvAIdpzZ_MjXNkSrA9KHtk-xLoXusOCi4Wezo39hGmqN2VmZAqr8Z_2Ba4PME61iF142BS2SdAdqxZLEZedDDmhcSeHsuCCRCuGlJkQqHWexn9eAhzNfRbKNVyB-OSXcCdtim7UZdnrDJ-0" class="absolute -right-2 -top-2 w-12 h-12 opacity-30 transform rotate-12 object-contain">
                    <div class="bg-term-pink/20 text-term-pink rounded-full p-1.5 flex items-center justify-center relative z-10">
                        <span class="material-symbols-outlined text-[18px]">check</span>
                    </div>
                    <div class="relative z-10">
                        <div class="font-bold tracking-wider uppercase text-sm text-slate-800 flex items-center gap-1">
                            COPIED TO CLIPBOARD <span class="material-symbols-outlined text-[14px] text-term-pink">favorite</span>
                        </div>
                        <div class="text-slate-500 text-xs mt-1 font-mono font-bold truncate max-w-[200px]">${text}</div>
                    </div>
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%) scale(0.9)';
                toast.style.transition = 'all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // Initialize on load
        window.onload = init;
    </script>
