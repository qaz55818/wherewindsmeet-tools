<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>醋飯槍枝資訊站｜ARC Raiders 武器資料庫</title>
  <style>
    :root {
      --bg: #06080d;
      --panel: rgba(12, 18, 30, 0.78);
      --panel-2: rgba(18, 27, 43, 0.82);
      --card: rgba(18, 27, 43, 0.86);
      --text: #eef5ff;
      --muted: #92a4bd;
      --line: rgba(255,255,255,.12);
      --gold: #f9c96b;
      --orange: #ff8a3d;
      --cyan: #61e9ff;
      --green: #7af3aa;
      --red: #ff6473;
      --purple: #b88cff;
      --blue: #7ba7ff;
      --radius: 24px;
      --shadow: 0 26px 90px rgba(0,0,0,.42);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(255,138,61,.25), transparent 26%),
        radial-gradient(circle at 86% 4%, rgba(97,233,255,.18), transparent 30%),
        radial-gradient(circle at 50% 92%, rgba(184,140,255,.16), transparent 34%),
        linear-gradient(135deg, #05070c 0%, #0d1423 48%, #070a11 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 86%);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.045), transparent);
      transform: translateX(-100%);
      animation: scan 9s linear infinite;
      z-index: -1;
    }

    @keyframes scan {
      0% { transform: translateX(-120%); opacity: 0; }
      12% { opacity: 1; }
      38% { transform: translateX(120%); opacity: 0; }
      100% { transform: translateX(120%); opacity: 0; }
    }

    .shell {
      width: min(1320px, calc(100% - 36px));
      margin: 0 auto;
      padding: 34px 0 70px;
    }

    .hero {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 36px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.095), rgba(255,255,255,.028)),
        rgba(8, 13, 22, .72);
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
      padding: clamp(24px, 5vw, 44px);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 560px;
      height: 560px;
      right: -190px;
      top: -220px;
      background: radial-gradient(circle, rgba(249,201,107,.2), transparent 62%);
      z-index: -1;
    }

    .hero::after {
      content: "CUFAN ARMORY";
      position: absolute;
      right: -28px;
      bottom: -20px;
      color: rgba(255,255,255,.04);
      font-size: clamp(56px, 12vw, 155px);
      font-weight: 1000;
      letter-spacing: -.09em;
      white-space: nowrap;
      z-index: -1;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 28px;
      align-items: end;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border: 1px solid rgba(249,201,107,.42);
      border-radius: 999px;
      background: rgba(249,201,107,.12);
      color: #ffe6ad;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .09em;
    }

    .pulse {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(122,243,170,.85);
      animation: pulse 1.7s infinite;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 13px rgba(122,243,170,0); }
      100% { box-shadow: 0 0 0 0 rgba(122,243,170,0); }
    }

    h1 {
      margin-top: 18px;
      font-size: clamp(42px, 8vw, 92px);
      line-height: .9;
      letter-spacing: -.08em;
      font-weight: 1000;
    }

    h1 span {
      display: block;
      background: linear-gradient(90deg, #fff 0%, #ffe4ad 30%, #61e9ff 76%, #fff 100%);
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 35px rgba(97,233,255,.16));
    }

    .subtitle {
      max-width: 820px;
      margin-top: 18px;
      color: var(--muted);
      line-height: 1.85;
      font-size: 16px;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.06);
      padding: 16px;
      backdrop-filter: blur(16px);
    }

    .stat strong {
      display: block;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -.04em;
    }

    .stat small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-weight: 800;
    }

    .dock {
      position: sticky;
      top: 14px;
      z-index: 20;
      margin-top: 20px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(7, 11, 18, .78);
      backdrop-filter: blur(22px);
      box-shadow: 0 18px 54px rgba(0,0,0,.32);
      padding: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 170px 170px 170px;
      gap: 12px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 17px;
      color: var(--text);
      background: rgba(255,255,255,.065);
      padding: 13px 14px;
      font-size: 14px;
      outline: none;
      transition: .22s ease;
    }

    input:focus, select:focus {
      border-color: rgba(97,233,255,.68);
      box-shadow: 0 0 0 4px rgba(97,233,255,.09);
    }

    select option { background: #101625; color: var(--text); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 13px;
      color: var(--muted);
      background: rgba(255,255,255,.045);
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 900;
      transition: .2s ease;
    }

    .chip:hover, .chip.active {
      color: #101010;
      border-color: transparent;
      background: linear-gradient(135deg, var(--gold), var(--orange));
      transform: translateY(-1px);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin: 24px 0 12px;
    }

    .board {
      min-height: 210px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 18px;
      box-shadow: 0 16px 48px rgba(0,0,0,.24);
      overflow: hidden;
    }

    .board h3 {
      font-size: 16px;
      letter-spacing: .04em;
      margin-bottom: 12px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,.075);
    }

    .rank-row:last-child { border-bottom: none; }

    .num {
      width: 26px; height: 26px;
      display: grid; place-items: center;
      border-radius: 10px;
      color: var(--gold);
      background: rgba(249,201,107,.13);
      font-weight: 1000;
      font-size: 12px;
    }

    .rank-name { font-size: 14px; font-weight: 1000; }
    .rank-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .rank-value { color: var(--cyan); font-weight: 1000; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 32px 0 16px;
    }

    .section-head h2 {
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: -.06em;
    }

    .count { color: var(--muted); font-weight: 900; white-space: nowrap; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.025)),
        var(--card);
      box-shadow: 0 14px 42px rgba(0,0,0,.24);
      padding: 18px;
      overflow: hidden;
      transition: .25s ease;
      min-height: 430px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 92% 0%, var(--accent), transparent 42%);
      opacity: .95;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(255,255,255,.23);
      box-shadow: 0 26px 72px rgba(0,0,0,.38);
    }

    .card-inner { position: relative; z-index: 1; }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .weapon-name {
      font-size: 25px;
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 1000;
    }

    .weapon-en {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .type-tag {
      padding: 8px 10px;
      border-radius: 13px;
      color: #111;
      background: linear-gradient(135deg, var(--gold), var(--orange));
      font-size: 12px;
      font-weight: 1000;
      white-space: nowrap;
    }

    .level-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 17px 0 13px;
    }

    .level-tabs button {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 8px 6px;
      color: var(--muted);
      background: rgba(255,255,255,.045);
      cursor: pointer;
      font-weight: 1000;
      transition: .2s ease;
    }

    .level-tabs button.active, .level-tabs button:hover {
      color: #081018;
      background: var(--cyan);
      border-color: transparent;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin: 12px 0;
    }

    .meta-item {
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 15px;
      background: rgba(255,255,255,.055);
      padding: 10px;
    }

    .meta-item small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 1000;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .meta-item b { font-size: 14px; }
    .danger { color: var(--red); }
    .good { color: var(--green); }
    .gold { color: var(--gold); }

    .bars { display: grid; gap: 10px; margin-top: 12px; }

    .bar-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 1000;
      margin-bottom: 6px;
    }

    .track {
      height: 9px;
      border-radius: 99px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      box-shadow: 0 0 18px rgba(97,233,255,.3);
    }

    .slots, .materials {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .slot, .mat {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      color: #d4deef;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .mat { color: #ffe4aa; background: rgba(249,201,107,.08); }

    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      border-left: 3px solid rgba(97,233,255,.7);
      padding-left: 10px;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 42px;
      border: 1px dashed rgba(255,255,255,.22);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255,255,255,.045);
      text-align: center;
    }

    .price-mark {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--gold);
      font-weight: 1000;
    }

    .arc-coin {
      position: relative;
      display: inline-block;
      width: 22px;
      height: 26px;
      flex: 0 0 22px;
      vertical-align: -6px;
      color: #fff;
      filter: drop-shadow(0 0 8px rgba(255,255,255,.28));
    }

    .arc-coin::before {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      top: 3px;
      bottom: 3px;
      border: 4px solid currentColor;
      border-radius: 50%;
      box-sizing: border-box;
    }

    .arc-coin::after {
      content: "";
      position: absolute;
      top: -1px;
      bottom: -1px;
      left: 50%;
      width: 4px;
      border-radius: 99px;
      background: currentColor;
      transform: translateX(-6px);
      box-shadow: 8px 0 0 currentColor;
    }

    .appendix {
      margin-top: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      padding: 20px;
      color: var(--muted);
      line-height: 1.85;
    }

    .appendix strong { color: var(--text); }

    @media (max-width: 1100px) {
      .hero-grid { grid-template-columns: 1fr; }
      .dashboard { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .controls { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 700px) {
      .shell { width: min(100% - 24px, 1320px); padding-top: 20px; }
      .hero { border-radius: 28px; }
      .hero-stats { grid-template-columns: 1fr 1fr; }
      .dock { position: static; border-radius: 24px; }
      .controls { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .card { min-height: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-grid">
        <div>
          <div class="badge"><span class="pulse"></span> ARC RAIDERS WEAPON DATABASE</div>
          <h1>醋飯槍枝<br><span>資訊站</span></h1>
          <p class="subtitle">
            這是一份以玩家查詢為核心設計的武器資料庫：整合分類、彈藥、裝甲穿透、價格、等級成長、模組插槽與升級材料。你可以快速搜尋武器、切換等級、排序排行榜，找到最適合醋飯小隊的作戰配置。
          </p>
        </div>
        <div class="hero-stats" id="heroStats"></div>
      </div>
    </section>

    <section class="dock">
      <div class="controls">
        <input id="searchInput" type="search" placeholder="搜尋武器、英文、彈藥、材料、穿透、特色…">
        <select id="sortSelect">
          <option value="default">預設排序</option>
          <option value="damage">傷害最高</option>
          <option value="fireRate">射速最高</option>
          <option value="range">射程最遠</option>
          <option value="stability">穩定最高</option>
          <option value="agility">敏捷最高</option>
          <option value="stealth">潛行最高</option>
          <option value="price">價格最高</option>
        </select>
        <select id="levelSelect">
          <option value="max">顯示最高等級</option>
          <option value="0">等級 I</option>
          <option value="1">等級 II</option>
          <option value="2">等級 III</option>
          <option value="3">等級 IV</option>
        </select>
        <select id="ammoSelect">
          <option value="全部">全部彈藥</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="dashboard">
      <div class="board"><h3>🔥 傷害排行榜</h3><div id="damageRank"></div></div>
      <div class="board"><h3>⚡ 射速排行榜</h3><div id="speedRank"></div></div>
      <div class="board"><h3>🎯 射程排行榜</h3><div id="rangeRank"></div></div>
    </section>

    <div class="section-head">
      <h2>武器資料庫</h2>
      <div class="count" id="resultCount"></div>
    </div>

    <section class="grid" id="weaponGrid"></section>

    <section class="appendix">
      <strong>資料註記：</strong>部分武器為實驗性或傳奇級，可能無法升級；部分未提供完整數值的項目會以「—」呈現。此頁面為單檔 HTML，可直接儲存為 <strong>index.html</strong> 使用，也能再改成粉絲專頁、Discord 社群或攻略網站入口頁。
    </section>
  </main>

    const resultCount = $("#resultCount");

    const metrics = ["damage","fireRate","range","stability","agility","stealth"];
    const max = Object.fromEntries(metrics.map(k => [k, Math.max(...weapons.flatMap(w => w.levels.map(l => Number(l[k]) || 0)))]));

    function clean(v, prefix = "") {
      if (v === null || v === undefined || v === "") return "—";
      return prefix + v;
    }

    function money(v) {
      if (!v) return "—";
      return `<span class="price-mark"><span class="arc-coin" aria-hidden="true"></span>${Number(v).toLocaleString("zh-Hant")}</span>`;
    }

    function selectedLevel(w) {
      if (state.cardLevels[w.en] !== undefined) return Math.min(state.cardLevels[w.en], w.levels.length - 1);
      if (levelSelect.value === "max") return w.levels.length - 1;
      return Math.min(Number(levelSelect.value), w.levels.length - 1);
    }

    function searchable(w) {
      return [w.type, w.name, w.alias, w.en, w.slots.join(" "), ...w.levels.flatMap(l => [l.ammo, l.penetration, l.mode, l.note, ...(l.materials || [])])].filter(Boolean).join(" ").toLowerCase();
    }

    function getList() {
      const q = searchInput.value.trim().toLowerCase();
      let list = weapons.filter(w => {
        const lv = w.levels[selectedLevel(w)];
        const typeOk = state.type === "全部" || w.type === state.type;
        const ammoOk = ammoSelect.value === "全部" || lv.ammo === ammoSelect.value;
        const searchOk = !q || searchable(w).includes(q);
        return typeOk && ammoOk && searchOk;
      });
      const sort = sortSelect.value;
      if (sort !== "default") {
        list.sort((a,b) => (b.levels[selectedLevel(b)][sort] || -1) - (a.levels[selectedLevel(a)][sort] || -1));
      }
      return list;
    }

    function bar(label, value, key) {
      const percent = value ? Math.max(5, (value / max[key]) * 100) : 0;
      return `<div><div class="bar-label"><span>${label}</span><span>${clean(value)}</span></div><div class="track"><div class="fill" style="width:${percent}%"></div></div></div>`;
    }

    function card(w) {
      const idx = selectedLevel(w);
      const l = w.levels[idx];
      const tabs = ["I","II","III","IV"].map((lv, i) => {
        const disabled = i >= w.levels.length;
        return `<button ${disabled ? "disabled style='opacity:.28;cursor:not-allowed'" : ""} class="${i === idx ? "active" : ""}" data-weapon="${w.en}" data-level="${i}">Lv.${lv}</button>`;
      }).join("");
      const mats = (l.materials || []).map(m => `<span class="mat">${m}</span>`).join("");
      const slots = w.slots.map(s => `<span class="slot">${s}</span>`).join("");
      const aka = w.alias ? `｜又稱：${w.alias}` : "";
      return `
        <article class="card" style="--accent:${colorMap[w.type] || "rgba(249,201,107,.2)"}">
          <div class="card-inner">
            <div class="card-top">
              <div><div class="weapon-name">${w.name}</div><div class="weapon-en">${w.en}${aka}</div></div>
              <div class="type-tag">${w.type}</div>
            </div>
            <div class="level-tabs">${tabs}</div>
            <div class="meta">
              <div class="meta-item"><small>價格</small><b class="gold">${money(l.price)}</b></div>
              <div class="meta-item"><small>彈藥 / 穿透</small><b>${clean(l.ammo)} / <span class="${l.penetration === "極強" || l.penetration === "強" ? "good" : ""}">${clean(l.penetration)}</span></b></div>
              <div class="meta-item"><small>射擊模式</small><b>${clean(l.mode)}</b></div>
              <div class="meta-item"><small>彈匣 / 爆頭</small><b>${clean(l.mag)} / ${clean(l.head)}</b></div>
            </div>
            <div class="bars">
              ${bar("傷害 Damage", l.damage, "damage")}
              ${bar("射速 Fire Rate", l.fireRate, "fireRate")}
              ${bar("射程 Range", l.range, "range")}
              ${bar("穩定 Stability", l.stability, "stability")}
              ${bar("敏捷 Agility", l.agility, "agility")}
              ${bar("潛行 Stealth", l.stealth, "stealth")}
            </div>
            <div class="slots">${slots}</div>
            ${mats ? `<div class="materials">${mats}</div>` : ""}
            ${l.note || w.legendary ? `<div class="note">${w.legendary ? "傳奇／實驗性武器。" : ""}${l.note || ""}</div>` : ""}
          </div>
        </article>`;
    }

    function renderChips() {
      const types = ["全部", ...new Set(weapons.map(w => w.type))];
      chips.innerHTML = types.map(t => `<button class="chip ${t === state.type ? "active" : ""}" data-type="${t}">${t}</button>`).join("");
      chips.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => { state.type = btn.dataset.type; render(); }));
    }

    function renderAmmo() {
      const current = ammoSelect.value || "全部";
      const ammos = ["全部", ...new Set(weapons.flatMap(w => w.levels.map(l => l.ammo)).filter(Boolean))];
      ammoSelect.innerHTML = ammos.map(a => `<option value="${a}">${a === "全部" ? "全部彈藥" : a}</option>`).join("");
      ammoSelect.value = ammos.includes(current) ? current : "全部";
    }

    function topList(key, target) {
      const rows = weapons.map(w => ({w, l:w.levels[w.levels.length - 1]})).filter(x => typeof x.l[key] === "number").sort((a,b) => b.l[key] - a.l[key]).slice(0,5);
      $(target).innerHTML = rows.map((x,i) => `<div class="rank-row"><div class="num">${i+1}</div><div><div class="rank-name">${x.w.name} <span style="color:var(--muted);font-weight:800">${x.w.en}</span></div><div class="rank-sub">${x.w.type}／${x.l.ammo}／Lv.${x.l.lv}</div></div><div class="rank-value">${x.l[key]}</div></div>`).join("");
    }

    function renderHero() {
      const topDamage = weapons.map(w => ({w, l:w.levels[w.levels.length - 1]})).filter(x => x.l.damage).sort((a,b) => b.l.damage - a.l.damage)[0];
      const legendary = weapons.filter(w => w.legendary).length;
      $("#heroStats").innerHTML = `
        <div class="stat"><strong>${weapons.length}</strong><small>收錄武器</small></div>
        <div class="stat"><strong>${new Set(weapons.map(w=>w.type)).size}</strong><small>武器分類</small></div>
        <div class="stat"><strong>${legendary}</strong><small>傳奇／實驗性</small></div>
        <div class="stat"><strong>${topDamage.w.name}</strong><small>最高傷害 ${topDamage.l.damage}</small></div>`;
    }

    function render() {
      renderChips();
      renderAmmo();
      const list = getList();
      resultCount.textContent = `目前顯示 ${list.length} / ${weapons.length} 把武器`;
      grid.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">找不到符合條件的武器，請換個分類、彈藥或關鍵字。</div>`;
      grid.querySelectorAll(".level-tabs button:not([disabled])").forEach(btn => {
        btn.addEventListener("click", () => {
          state.cardLevels[btn.dataset.weapon] = Number(btn.dataset.level);
          render();
        });
      });
    }

    [searchInput, sortSelect, levelSelect, ammoSelect].forEach(el => el.addEventListener("input", render));
    sortSelect.addEventListener("change", render);
    levelSelect.addEventListener("change", () => { state.cardLevels = {}; render(); });
    ammoSelect.addEventListener("change", render);

    renderHero();
    topList("damage", "#damageRank");
    topList("fireRate", "#speedRank");
    topList("range", "#rangeRank");
    render();
  </script>
</body>
</html>
