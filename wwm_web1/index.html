<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>燕雲十六聲 - 百業成員請假系統</title>
    <!-- 這裡的警告可以完全忽略，不影響任何功能 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #eaddcf;
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23d0c0ad" fill-opacity="0.4"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
            color: #3e362e;
            min-height: 100vh;
        }

        /* 古風邊框 */
        .gufeng-border {
            border: 2px solid #5a4a3f;
            position: relative;
        }
        .gufeng-border::before, .gufeng-border::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #5a4a3f;
        }
        .gufeng-border::before { top: -2px; left: -2px; }
        .gufeng-border::after { bottom: -2px; right: -2px; }

        .gufeng-inner-border {
            border: 1px solid #8e7f70;
            padding: 2rem;
        }

        /* 標題紅底白字設計 */
        .title-badge {
            background-color: #8c2a2a;
            color: #f2e9de;
            padding: 0.5rem 2rem;
            display: inline-block;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            letter-spacing: 0.2em;
        }

        /* 按鈕樣式 */
        .btn-primary {
            background-color: #5a4a3f;
            color: #f2e9de;
            border: 1px solid #3e362e;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: #8c2a2a;
            border-color: #8c2a2a;
        }
        
        .btn-danger {
            background-color: #8c2a2a;
            color: #f2e9de;
            border: 1px solid #5a1a1a;
            transition: all 0.3s;
        }
        .btn-danger:hover {
            background-color: #a33535;
        }

        /* 輸入框樣式 */
        .form-input {
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid #a89a8c;
            border-radius: 2px;
            transition: border-color 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #8c2a2a;
            background-color: rgba(255, 255, 255, 0.8);
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #eaddcf; 
        }
        ::-webkit-scrollbar-thumb {
            background: #a89a8c; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8e7f70; 
        }

        /* 提示框動畫 */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-20px) translateX(-50%); }
            10% { opacity: 1; transform: translateY(0) translateX(-50%); }
            90% { opacity: 1; transform: translateY(0) translateX(-50%); }
            100% { opacity: 0; transform: translateY(-20px) translateX(-50%); }
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #8c2a2a;
            color: #f2e9de;
            padding: 10px 24px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            pointer-events: none;
        }
        .toast.show {
            display: block;
            animation: fadeInOut 3s forwards;
        }

        /* 管理員驗證彈窗 */
        #adminAuthModal {
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <!-- 系統提示框 -->
    <div id="toastMessage" class="toast">訊息提示</div>

    <!-- 管理員驗證彈窗 (預設隱藏) -->
    <div id="adminAuthModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="gufeng-border bg-[#f2e9de] shadow-2xl p-6 max-w-sm w-full text-center">
            <h3 class="text-xl font-bold text-[#5a4a3f] mb-4">管理員身分驗證</h3>
            <input type="password" id="adminPwdInput" placeholder="請輸入管理密碼" class="form-input w-full px-4 py-2 mb-4 text-center">
            <div class="flex space-x-4">
                <button id="cancelAdminBtn" class="flex-1 px-4 py-2 border border-[#8e7f70] text-[#5a4a3f] hover:bg-[#eaddcf] transition">取消</button>
                <button id="verifyAdminBtn" class="flex-1 btn-primary px-4 py-2">驗證</button>
            </div>
        </div>
    </div>

    <!-- 頂部管理員設定面板 (預設隱藏，驗證後顯示) -->
    <div id="adminPanel" class="hidden w-full max-w-6xl mb-6 gufeng-border bg-[#d0c0ad] shadow-md p-4">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center">
            <h2 class="text-lg font-bold text-[#8c2a2a] mb-4 md:mb-0 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
                管理中心 (已解鎖)
            </h2>
            <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-4 w-full md:w-auto">
                <div class="flex items-center bg-[#f2e9de] p-2 rounded border border-[#a89a8c]">
                    <span class="text-sm font-bold text-[#5a4a3f] mr-2">請假冷卻(分鐘):</span>
                    <input type="number" id="cdTimeInput" class="w-16 px-2 py-1 bg-white border border-[#a89a8c] text-center text-sm" min="0">
                    <button id="saveCdBtn" class="ml-2 text-xs bg-[#5a4a3f] text-[#f2e9de] px-2 py-1 hover:bg-[#8c2a2a] transition">儲存</button>
                </div>
                <div class="flex items-center bg-[#f2e9de] p-2 rounded border border-[#a89a8c]">
                    <span class="text-sm font-bold text-[#5a4a3f] mr-2">封鎖IP:</span>
                    <input type="text" id="banIpInput" placeholder="輸入要封鎖的IP" class="w-32 px-2 py-1 bg-white border border-[#a89a8c] text-sm">
                    <button id="banIpBtn" class="ml-2 text-xs btn-danger px-2 py-1 transition">封鎖</button>
                </div>
            </div>
        </div>
        <div id="bannedIpsContainer" class="mt-4 text-sm text-[#5a4a3f]">
            <span class="font-bold">已封鎖的 IP：</span>
            <span id="bannedIpsList" class="italic text-[#8e7f70]">無</span>
        </div>
    </div>

    <!-- 主要系統介面 -->
    <div id="appView" class="w-full max-w-6xl flex flex-col items-center">

        <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 左側：請假表單 -->
            <div class="gufeng-border bg-[#f2e9de] shadow-xl relative mt-4">
                <div class="absolute -top-5 left-1/2 transform -translate-x-1/2">
                    <div class="title-badge text-xl font-black">百業請假登記</div>
                </div>
                
                <div class="gufeng-inner-border mt-2 h-full flex flex-col justify-between">
                    <form id="leaveForm" class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold mb-2 text-[#5a4a3f]">遊戲名稱 <span class="text-red-600">*</span></label>
                            <input type="text" id="gameId" required placeholder="請輸入遊戲名稱" 
                                   class="form-input w-full px-4 py-2 text-[#3e362e] placeholder-[#a89a8c]">
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2 text-[#5a4a3f]">百業戰請假日期 <span class="text-red-600">*</span></label>
                            <input type="date" id="leaveDate" required 
                                   class="form-input w-full px-4 py-2 text-[#3e362e]">
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2 text-[#5a4a3f]">請假原因 <span class="text-red-600">*</span></label>
                            <select id="reasonSelect" required class="form-input w-full px-4 py-2 text-[#3e362e] mb-2 cursor-pointer">
                                <option value="" disabled selected>請選擇請假原因</option>
                                <option value="有事無法參加">有事無法參加</option>
                                <option value="可能晚點才能參加">可能晚點才能參加</option>
                                <option value="其他">其他 (自行輸入)</option>
                            </select>
                            <input type="text" id="reasonOther" maxlength="30" placeholder="請輸入其他原因 (限30字內)" 
                                   class="form-input w-full px-4 py-2 text-[#3e362e] placeholder-[#a89a8c] hidden">
                        </div>

                        <div class="pt-4 text-center">
                            <button type="submit" id="submitBtn" class="btn-primary w-full sm:w-auto px-12 py-3 font-bold tracking-widest text-lg cursor-pointer">
                                呈交請假帖
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 右側：請假紀錄 -->
            <div class="gufeng-border bg-[#f2e9de] shadow-xl relative mt-4 md:mt-4">
                <div class="absolute -top-5 left-1/2 transform -translate-x-1/2">
                    <div class="title-badge text-xl font-black" style="background-color: #5a4a3f;">近期請假卷宗</div>
                </div>

                <div class="gufeng-inner-border mt-2 h-full flex flex-col">
                    <div id="recordsContainer" class="hidden flex-1 overflow-y-auto pr-2 space-y-4 max-h-[500px]">
                        <!-- 紀錄卡片模板 -->
                    </div>
                    
                    <div id="emptyState" class="hidden text-center py-12 text-[#8e7f70]">
                        尚無人告假，江湖一片祥和。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部管理員入口 -->
    <div class="fixed bottom-4 right-4">
        <button id="openAdminBtn" class="text-sm text-[#8e7f70] hover:text-[#5a4a3f] transition font-bold px-2 py-1 bg-[#eaddcf]/80 rounded">⚙️ 管理模式</button>
    </div>

    <!-- ========================================== -->
    <!-- 將 JS 直接合併進來，解決所有本地雙擊的 CORS 錯誤 -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb8FCyP4bT8zkNXZymqkhXL7CU8QaDp_U",
            authDomain: "wwm-web-142a4.firebaseapp.com",
            projectId: "wwm-web-142a4",
            storageBucket: "wwm-web-142a4.firebasestorage.app",
            messagingSenderId: "902808232658",
            appId: "1:902808232658:web:a16b7f0c812fe4254cc30b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const COLLECTION_NAME = 'leave_records';
        const CONFIG_COLLECTION = 'system_config';
        const CONFIG_DOC = 'settings';

        let currentIp = "Unknown";
        let isAdmin = false;
        let systemConfig = { cdTimeMinutes: 0, bannedIps: [] };
        let allRecords = [];

        const form = document.getElementById('leaveForm');
        const reasonSelect = document.getElementById('reasonSelect');
        const reasonOther = document.getElementById('reasonOther');
        const submitBtn = document.getElementById('submitBtn');
        const recordsContainer = document.getElementById('recordsContainer');
        const emptyState = document.getElementById('emptyState');
        const toastEl = document.getElementById('toastMessage');

        const openAdminBtn = document.getElementById('openAdminBtn');
        const adminAuthModal = document.getElementById('adminAuthModal');
        const adminPwdInput = document.getElementById('adminPwdInput');
        const verifyAdminBtn = document.getElementById('verifyAdminBtn');
        const cancelAdminBtn = document.getElementById('cancelAdminBtn');
        const adminPanel = document.getElementById('adminPanel');
        const cdTimeInput = document.getElementById('cdTimeInput');
        const saveCdBtn = document.getElementById('saveCdBtn');
        const banIpInput = document.getElementById('banIpInput');
        const banIpBtn = document.getElementById('banIpBtn');
        const bannedIpsList = document.getElementById('bannedIpsList');

        async function fetchIp() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                currentIp = data.ip;
            } catch (error) {
                console.warn("無法取得 IP 資訊", error);
                currentIp = "Unknown_" + Math.random().toString(36).substr(2, 9);
            }
        }

        function showToast(message, isError = false) {
            toastEl.textContent = message;
            toastEl.style.backgroundColor = isError ? '#5a4a3f' : '#8c2a2a';
            toastEl.classList.remove('show');
            void toastEl.offsetWidth; 
            toastEl.classList.add('show');
            setTimeout(() => { toastEl.classList.remove('show'); }, 3000);
        }

        reasonSelect.addEventListener('change', (e) => {
            if (e.target.value === '其他') {
                reasonOther.classList.remove('hidden');
                reasonOther.required = true;
            } else {
                reasonOther.classList.add('hidden');
                reasonOther.required = false;
                reasonOther.value = ''; 
            }
        });

        async function initSystemConfig() {
            const configRef = doc(db, CONFIG_COLLECTION, CONFIG_DOC);
            const docSnap = await getDoc(configRef);
            
            if (!docSnap.exists()) {
                await setDoc(configRef, { cdTimeMinutes: 0, bannedIps: [] });
            }

            onSnapshot(configRef, (snapshot) => {
                if(snapshot.exists()) {
                    systemConfig = snapshot.data();
                    if (isAdmin) {
                        cdTimeInput.value = systemConfig.cdTimeMinutes || 0;
                        renderBannedIps();
                    }
                }
            });
        }

        function loadData() {
            const q = query(collection(db, COLLECTION_NAME), orderBy('submitTime', 'desc'));

            onSnapshot(q, (snapshot) => {
                allRecords = [];
                snapshot.forEach((doc) => {
                    allRecords.push({ id: doc.id, ...doc.data() });
                });
                renderRecords(allRecords);
            }, (error) => {
                console.error("讀取失敗:", error);
                showToast("無法連接卷宗庫，請檢查權限", true);
            });
        }

        function renderBannedIps() {
            if (!systemConfig.bannedIps || systemConfig.bannedIps.length === 0) {
                bannedIpsList.innerHTML = '<span class="italic text-[#8e7f70]">無</span>';
                return;
            }
            
            bannedIpsList.innerHTML = '';
            systemConfig.bannedIps.forEach(ip => {
                const span = document.createElement('span');
                span.className = 'inline-flex items-center bg-[#8c2a2a] text-[#f2e9de] px-2 py-0.5 rounded mr-2 mb-2 text-xs';
                span.innerHTML = `${escapeHTML(ip)} <button data-ip="${escapeHTML(ip)}" class="ml-1 text-[#eaddcf] hover:text-white unban-btn">×</button>`;
                bannedIpsList.appendChild(span);
            });

            document.querySelectorAll('.unban-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const ipToRemove = e.target.getAttribute('data-ip');
                    const newBannedList = systemConfig.bannedIps.filter(ip => ip !== ipToRemove);
                    await updateDoc(doc(db, CONFIG_COLLECTION, CONFIG_DOC), { bannedIps: newBannedList });
                    showToast(`已解除封鎖 ${ipToRemove}`);
                });
            });
        }

        window.deleteRecord = async function(id) {
            if(confirm("確定要銷毀這份請假卷宗嗎？此操作無法復原。")) {
                try {
                    await deleteDoc(doc(db, COLLECTION_NAME, id));
                    showToast("卷宗已銷毀");
                } catch (e) {
                    showToast("銷毀失敗，請檢查權限", true);
                }
            }
        };

        function renderRecords(records) {
            if (records.length === 0) {
                recordsContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            const leaveCounts = {};
            records.forEach(r => {
                const name = (r.gameId || '').trim();
                if (name) {
                    leaveCounts[name] = (leaveCounts[name] || 0) + 1;
                }
            });

            emptyState.classList.add('hidden');
            recordsContainer.classList.remove('hidden');
            recordsContainer.innerHTML = '';

            records.forEach(record => {
                const submitDateObj = new Date(record.submitTime);
                const dateStr = submitDateObj.toLocaleDateString('zh-TW') + ' ' + 
                                submitDateObj.getHours().toString().padStart(2, '0') + ':' + 
                                submitDateObj.getMinutes().toString().padStart(2, '0');

                let weekdayStr = "";
                if (record.leaveDate) {
                    const dateParts = record.leaveDate.split('-');
                    if (dateParts.length === 3) {
                        const localDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                        const days = ['日', '一', '二', '三', '四', '五', '六'];
                        weekdayStr = ` (星期${days[localDate.getDay()]})`;
                    }
                }

                const playerName = (record.gameId || '').trim();
                const totalLeaves = leaveCounts[playerName] || 1;
                
                const safeGameId = escapeHTML(record.gameId);
                const safeReason = escapeHTML(record.reason).replace(/\n/g, '<br>');
                const safeIp = escapeHTML(record.ipAddress || '無紀錄');

                const adminHtml = isAdmin ? `
                    <div class="mt-3 pt-2 border-t border-[#a89a8c]/30 flex justify-between items-center">
                        <span class="text-xs text-[#8c2a2a] font-bold">來源 IP: ${safeIp}</span>
                        <button onclick="deleteRecord('${record.id}')" class="text-xs bg-[#8c2a2a] text-white px-3 py-1 rounded hover:bg-[#a33535] transition">撤回/刪除</button>
                    </div>
                ` : '';

                const card = document.createElement('div');
                card.className = 'bg-white/40 p-4 border-l-4 border-[#8c2a2a] shadow-sm mb-3 relative';
                
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3">
                        <span class="font-bold text-lg text-[#8c2a2a] flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
                            ${safeGameId}
                            <span class="text-xs bg-[#eaddcf] text-[#5a4a3f] px-2 py-0.5 rounded ml-2 font-normal border border-[#a89a8c]">累計請假 ${totalLeaves} 次</span>
                        </span>
                        <span class="text-xs text-[#8e7f70] mt-1 sm:mt-0">呈交於: ${dateStr}</span>
                    </div>
                    <div class="text-sm mb-2 text-[#5a4a3f] border-b border-[#a89a8c]/30 pb-2">
                        <span class="font-bold">請假日期：</span> ${record.leaveDate}${weekdayStr}
                    </div>
                    <div class="text-sm text-[#3e362e] bg-white/60 p-3 rounded leading-relaxed">
                        <span class="font-bold text-[#5a4a3f]">事由：</span><br/>
                        ${safeReason}
                    </div>
                    ${adminHtml}
                `;
                recordsContainer.appendChild(card);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (systemConfig.bannedIps && systemConfig.bannedIps.includes(currentIp)) {
                showToast('您已被禁止呈交請假帖，請聯繫管理員。', true);
                return;
            }

            if (systemConfig.cdTimeMinutes > 0 && currentIp !== "Unknown") {
                const myLastRecord = allRecords.find(r => r.ipAddress === currentIp);
                if (myLastRecord) {
                    const diffMinutes = (Date.now() - myLastRecord.submitTime) / 60000;
                    if (diffMinutes < systemConfig.cdTimeMinutes) {
                        const remain = Math.ceil(systemConfig.cdTimeMinutes - diffMinutes);
                        showToast(`請假冷卻中，請於 ${remain} 分鐘後再試。`, true);
                        return;
                    }
                }
            }

            const gameId = document.getElementById('gameId').value.trim();
            const leaveDate = document.getElementById('leaveDate').value;
            
            let finalReason = reasonSelect.value;
            if (finalReason === '其他') {
                finalReason = reasonOther.value.trim();
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-pulse">呈交中...</span>';

            try {
                await addDoc(collection(db, COLLECTION_NAME), {
                    gameId: gameId,
                    leaveDate: leaveDate,
                    reason: finalReason,
                    submitTime: Date.now(),
                    ipAddress: currentIp
                });

                showToast('請假帖已飛鴿傳書呈交！');
                form.reset();
                reasonOther.classList.add('hidden');
                reasonOther.required = false;
                
            } catch (error) {
                console.error("寫入失敗:", error);
                showToast('呈交失敗，請檢查資料庫權限設定', true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '呈交請假帖';
            }
        });

        openAdminBtn.addEventListener('click', () => {
            if (isAdmin) {
                isAdmin = false;
                adminPanel.classList.add('hidden');
                openAdminBtn.innerHTML = "⚙️ 管理模式";
                showToast("已退出管理模式");
                renderRecords(allRecords);
            } else {
                adminAuthModal.classList.remove('hidden');
                adminPwdInput.value = '';
                adminPwdInput.focus();
            }
        });

        cancelAdminBtn.addEventListener('click', () => {
            adminAuthModal.classList.add('hidden');
        });

        verifyAdminBtn.addEventListener('click', async () => {
            const inputPwd = adminPwdInput.value.trim();
            if (!inputPwd) return;

            verifyAdminBtn.disabled = true;
            verifyAdminBtn.innerHTML = "驗證中...";

            try {
                const adminAuthRef = doc(db, CONFIG_COLLECTION, 'admin_auth');
                const adminSnap = await getDoc(adminAuthRef);
                
                let dbPassword = "admin888"; 
                
                if (adminSnap.exists()) {
                    dbPassword = adminSnap.data().password;
                } else {
                    await setDoc(adminAuthRef, { password: "admin888" });
                }

                if (inputPwd === dbPassword) {
                    isAdmin = true;
                    adminAuthModal.classList.add('hidden');
                    adminPanel.classList.remove('hidden');
                    openAdminBtn.innerHTML = "🔒 退出管理";
                    
                    cdTimeInput.value = systemConfig.cdTimeMinutes || 0;
                    renderBannedIps();
                    renderRecords(allRecords); 
                    
                    showToast("身分驗證成功，管理模式已開啟");
                } else {
                    showToast("密碼錯誤，請重新輸入", true);
                }
            } catch (error) {
                console.error("密碼驗證異常:", error);
                showToast("驗證異常，請確認資料庫連線或規則", true);
            } finally {
                verifyAdminBtn.disabled = false;
                verifyAdminBtn.innerHTML = "驗證";
            }
        });

        saveCdBtn.addEventListener('click', async () => {
            const newCd = parseInt(cdTimeInput.value) || 0;
            try {
                await updateDoc(doc(db, CONFIG_COLLECTION, CONFIG_DOC), { cdTimeMinutes: newCd });
                showToast("冷卻時間更新成功");
            } catch(e) { showToast("更新失敗", true); }
        });

        banIpBtn.addEventListener('click', async () => {
            const ipToBan = banIpInput.value.trim();
            if (!ipToBan) return;
            
            const currentBanned = systemConfig.bannedIps || [];
            if (currentBanned.includes(ipToBan)) {
                showToast("此 IP 已在封鎖清單中", true);
                return;
            }

            try {
                currentBanned.push(ipToBan);
                await updateDoc(doc(db, CONFIG_COLLECTION, CONFIG_DOC), { bannedIps: currentBanned });
                banIpInput.value = '';
                showToast(`已封鎖 IP: ${ipToBan}`);
            } catch(e) { showToast("封鎖失敗", true); }
        });

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        fetchIp().then(() => {
            initSystemConfig();
            loadData();
        });
    </script>
</body>
</html>
