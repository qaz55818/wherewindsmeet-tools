        let currentSortOrder = 'desc';

        // 禮物 Icon 產生器
        function getGiftIconHtml(name) {
            let iconContent = '';
            let colorClass = 'text-gray-400';
            
            if (name.includes("玫瑰")) {
                return `<span class="text-rose-500 text-xl">🌹</span>`;
            } else if (name.includes("宇宙") || name.includes("TikTok")) {
                return `<span class="text-purple-500 text-xl">🪐</span>`;
            } else if (name.includes("獨角獸")) {
                return `<span class="text-pink-400 text-xl">🦄</span>`;
            } else if (name.includes("夜曲")) {
                return `<span class="text-blue-500 text-xl">🎵</span>`;
            } else if (name.includes("愛我")) {
                return `<span class="text-red-500 text-xl">❤️</span>`;
            } else {
                return `<i data-lucide="gift" class="text-gray-400 w-5 h-5"></i>`;
            }
        }

        // 計算統計數據
        function calculateStats() {
            const totalCoins = rawData.reduce((acc, curr) => acc + curr.coins, 0);
            const totalGifts = rawData.length;
            const maxGift = rawData.reduce((prev, current) => (prev.coins > current.coins) ? prev : current);
            
            const giftCounts = rawData.reduce((acc, curr) => {
                acc[curr.gift] = (acc[curr.gift] || 0) + 1;
                return acc;
            }, {});
            const mostFrequent = Object.entries(giftCounts).sort((a,b) => b[1] - a[1])[0];

            return { totalCoins, totalGifts, maxGift, mostFrequent };
        }

        // 渲染統計卡片
        function renderStats() {
            const stats = calculateStats();
            document.getElementById('stat-total-coins').textContent = stats.totalCoins.toLocaleString();
            document.getElementById('stat-total-count').textContent = stats.totalGifts.toLocaleString();
            document.getElementById('stat-max-gift-name').textContent = stats.maxGift.gift;
            document.getElementById('stat-max-gift-coins').textContent = stats.maxGift.coins.toLocaleString();
            document.getElementById('stat-freq-name').textContent = stats.mostFrequent[0];
            document.getElementById('stat-freq-count').textContent = stats.mostFrequent[1];
        }

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const sortedData = [...rawData].sort((a, b) => {
                const dateA = new Date(`${a.date} ${a.time}`);
                const dateB = new Date(`${b.date} ${b.time}`);
                return currentSortOrder === 'desc' ? dateB - dateA : dateA - dateB;
            });

            sortedData.forEach(row => {
                const tr = document.createElement('tr');
                
                // 設定行樣式與高亮
                let bgClass = '';
                if (row.highlight === 'legendary') bgClass = 'bg-purple-50/60 hover:bg-purple-100/60';
                else if (row.highlight === 'epic') bgClass = 'bg-pink-50/50 hover:bg-pink-100/50';
                else if (row.highlight === 'high') bgClass = 'bg-indigo-50/40 hover:bg-indigo-100/40';
                
                tr.className = `hover:bg-slate-50 transition-colors group ${bgClass}`;

                // 設定圖標背景
                const iconBgClass = row.highlight === 'legendary' ? 'bg-purple-100 ring-2 ring-purple-200' : 'bg-slate-100';
                const textClass = row.highlight === 'legendary' ? 'text-purple-700' : 'text-slate-700';

                // Top 標籤
                const topLabel = row.highlight ? 
                    `<span class="ml-2 px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide bg-yellow-100 text-yellow-700 border border-yellow-200">Top</span>` : '';

                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="flex flex-col">
                            <span class="font-medium text-slate-700 text-sm">${row.date}</span>
                            <span class="text-xs text-slate-400">${row.time}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg shadow-sm ${iconBgClass}">
                                ${getGiftIconHtml(row.gift)}
                            </div>
                            <div>
                                <span class="font-bold ${textClass}">${row.gift}</span>
                                ${topLabel}
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2 text-slate-500">
                            <i data-lucide="user" class="w-3.5 h-3.5"></i>
                            <span class="text-sm font-mono truncate max-w-[120px]" title="${row.user}">${row.user}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <span class="inline-block px-2 py-1 bg-slate-100 rounded text-xs font-bold text-slate-600">x${row.count}</span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="font-bold text-slate-800 flex items-center justify-end gap-1">
                            ${row.coins.toLocaleString()}
                            <i data-lucide="coins" class="text-yellow-500 w-3.5 h-3.5 mb-0.5"></i>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 重新渲染圖標
            lucide.createIcons();
        }

        // 初始化與事件監聽
        document.addEventListener('DOMContentLoaded', () => {
            renderStats();
            renderTable();
            lucide.createIcons();

            const sortBtn = document.getElementById('sort-btn');
            const sortLabel = document.getElementById('sort-label');
            
            sortBtn.addEventListener('click', () => {

                sortLabel.textContent = currentSortOrder === 'desc' ? '時間：新 → 舊' : '時間：舊 → 新';
                renderTable();
            });
