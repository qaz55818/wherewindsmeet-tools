<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表弟失蹤預測系統</title>
    <!-- 引入 Tailwind CSS 框架 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 神秘風格的漸層背景 */
            background: linear-gradient(135deg, #141E30, #243B55);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* 玻璃擬物風格的卡片效果 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* 淡入動畫 */
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 脈衝發光效果 */
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(253, 224, 71, 0.5); }
            50% { text-shadow: 0 0 25px rgba(253, 224, 71, 1); }
            100% { text-shadow: 0 0 10px rgba(253, 224, 71, 0.5); }
        }
    </style>
</head>
<body class="p-4">

    <!-- 主容器 -->
    <div class="glass-panel rounded-3xl p-8 max-w-md w-full text-center relative overflow-hidden fade-in">
        
        <!-- 裝飾用背景光暈 -->
        <div class="absolute top-0 left-0 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse"></div>
        <div class="absolute bottom-0 right-0 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse" style="animation-delay: 1s;"></div>

        <div class="relative z-10">
            <!-- 標題區塊 -->
            <div class="text-7xl mb-4 drop-shadow-lg">🔮</div>
            <h1 class="text-3xl font-black mb-2 tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-purple-300">
                玄學預測系統
            </h1>
            
            <div class="my-8 py-4 bg-black/20 rounded-2xl border border-white/5 shadow-inner">
                <p class="text-2xl font-bold text-yellow-300 pulse-glow leading-relaxed">
                    「表弟今天晚上<br>是否會失蹤？」
                </p>
            </div>

            <!-- 選擇按鈕區塊 -->
            <div id="button-container" class="flex flex-col sm:flex-row gap-4 justify-center mt-6">
                <button onclick="predict('yes')" class="group relative w-full flex justify-center py-4 px-6 border border-transparent text-lg font-bold rounded-xl text-white bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 focus:ring-offset-[#1a2a3a] transition-all transform hover:-translate-y-1 shadow-[0_0_15px_rgba(239,68,68,0.5)]">
                    會！<br><span class="text-xs font-normal opacity-80 mt-1 block">(絕對會跑出去浪)</span>
                </button>
                
                <button onclick="predict('no')" class="group relative w-full flex justify-center py-4 px-6 border border-transparent text-lg font-bold rounded-xl text-white bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 focus:ring-offset-[#1a2a3a] transition-all transform hover:-translate-y-1 shadow-[0_0_15px_rgba(16,185,129,0.5)]">
                    不會！<br><span class="text-xs font-normal opacity-80 mt-1 block">(應該乖乖宅在家)</span>
                </button>
            </div>

            <!-- 讀取與結果顯示區塊 (初始隱藏) -->
            <div id="result-area" class="hidden mt-6 min-h-[150px] flex flex-col justify-center">
                
                <!-- 讀取動畫 -->
                <div id="loading" class="flex flex-col items-center">
                    <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-white mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-sm text-blue-200 tracking-widest animate-pulse">正在透過宇宙電波與表弟的腦波連線中...</p>
                </div>

                <!-- 最終結果 -->
                <div id="final-result" class="hidden glass-panel p-6 rounded-2xl fade-in relative overflow-hidden">
                    <div id="result-icon" class="text-5xl mb-3 relative z-10"></div>
                    <div id="result-text" class="text-lg font-bold relative z-10 leading-relaxed"></div>
                </div>

                <!-- 重新預測按鈕 -->
                <button id="reset-btn" onclick="resetApp()" class="hidden mx-auto mt-6 px-4 py-2 text-sm text-gray-400 hover:text-white border border-gray-600 hover:border-gray-400 rounded-full transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    再測一次
                </button>
            </div>
        </div>
    </div>

    <!-- 邏輯腳本 -->
    <script>
        function predict(choice) {
            // 獲取 DOM 元素
            const btnContainer = document.getElementById('button-container');
            const resultArea = document.getElementById('result-area');
            const loading = document.getElementById('loading');
            const finalResult = document.getElementById('final-result');
            const resultText = document.getElementById('result-text');
            const resultIcon = document.getElementById('result-icon');
            const resetBtn = document.getElementById('reset-btn');

            // 切換顯示狀態
            btnContainer.classList.add('hidden');
            resultArea.classList.remove('hidden');
            loading.classList.remove('hidden');
            finalResult.classList.add('hidden');
            resetBtn.classList.add('hidden');

            // 模擬計算時間 (2.5秒)
            setTimeout(() => {
                loading.classList.add('hidden');
                finalResult.classList.remove('hidden');
                resetBtn.classList.remove('hidden');
                finalResult.classList.remove('border-red-500', 'border-emerald-500', 'bg-red-900/20', 'bg-emerald-900/20');

                if (choice === 'yes') {
                    // 「會失蹤」的結果
                    resultIcon.innerHTML = "🚨 🏍️ 💨";
                    resultText.innerHTML = "<span class='text-red-400 text-xl block mb-2'>大凶！極度危險！</span><br>系統強烈建議：立刻反鎖大門，並把他的機車鑰匙藏進冷凍庫裡！他今晚蠢蠢欲動！";
                    finalResult.classList.add('border', 'border-red-500', 'bg-red-900/20');
                } else {
                    // 「不會失蹤」的結果
                    resultIcon.innerHTML = "🎮 🛋️ 🍕";
                    resultText.innerHTML = "<span class='text-emerald-400 text-xl block mb-2'>吉！安全下莊！</span><br>預測顯示他今天懶癌發作。很高機率只會癱在沙發上滑手機或打遊戲到天亮。";
                    finalResult.classList.add('border', 'border-emerald-500', 'bg-emerald-900/20');
                }
            }, 2500);
        }

        function resetApp() {
            // 重置回初始狀態
            document.getElementById('button-container').classList.remove('hidden');
            document.getElementById('result-area').classList.add('hidden');
            
            // 移除動畫類別以便下次再次觸發
            const finalResult = document.getElementById('final-result');
            finalResult.classList.remove('fade-in');
            void finalResult.offsetWidth; // 觸發 reflow
            finalResult.classList.add('fade-in');
        }
    </script>
</body>
</html>
