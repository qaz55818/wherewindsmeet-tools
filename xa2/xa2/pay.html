<!DOCTYPE html>

<html lang="zh-TW">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>儲值中心 - 墨雪巔</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&amp;family=Manrope:wght@400;600;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-container": "#f9646e",
                        "on-tertiary-fixed-variant": "#8d1226",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#eff1f4",
                        "primary": "#021a35",
                        "inverse-primary": "#b3c8eb",
                        "secondary": "#5c5f60",
                        "surface-bright": "#f7f9fc",
                        "surface": "#f7f9fc",
                        "secondary-fixed-dim": "#c5c7c8",
                        "inverse-surface": "#2d3133",
                        "on-secondary-fixed": "#191c1d",
                        "secondary-container": "#e1e3e4",
                        "outline": "#74777e",
                        "tertiary-fixed": "#ffdad9",
                        "secondary-fixed": "#e1e3e4",
                        "tertiary-container": "#640014",
                        "surface-variant": "#e0e3e6",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#b3c8eb",
                        "on-secondary-fixed-variant": "#454748",
                        "on-surface": "#191c1e",
                        "tertiary": "#3d0009",
                        "tertiary-fixed-dim": "#ffb3b3",
                        "surface-container-highest": "#e0e3e6",
                        "on-surface-variant": "#44474d",
                        "on-primary-fixed-variant": "#334865",
                        "on-secondary-container": "#626566",
                        "background": "#f7f9fc",
                        "surface-container": "#eceef1",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c4c6ce",
                        "surface-container-high": "#e6e8eb",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#8397b8",
                        "surface-container-low": "#f2f4f7",
                        "surface-tint": "#4b5f7e",
                        "on-tertiary-fixed": "#40000a",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#041c37",
                        "surface-dim": "#d8dadd",
                        "primary-fixed": "#d4e3ff",
                        "primary-container": "#1a2f4b",
                        "on-background": "#191c1e"
                    },
                    borderRadius: {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "0px"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif TC", "serif"],
                        "body": ["Noto Serif TC", "serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
        }

        .label-font {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body
    class="bg-surface text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
    <!-- TopNavBar -->
    <nav
        class="fixed top-0 w-full z-50 h-20 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl no-line tonal-shift-bottom flat no shadows font-noto-serif text-lg tracking-tight">
        <div class="flex justify-between items-center w-full px-12 max-w-screen-2xl mx-auto h-full">
            <div class="text-2xl font-bold tracking-tighter text-slate-900 dark:text-slate-50">
                墨雪巔 (The Silent Peak)
            </div>
            <div class="hidden md:flex space-x-8">
                <a class="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-all duration-300"
                    href="#">首頁</a>
                <a class="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-all duration-300"
                    href="#">遊戲下載</a>
                <a class="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-all duration-300"
                    href="#">活動情報</a>
                <a class="text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-all duration-300"
                    href="#">官方公告</a>
                <a class="text-slate-950 dark:text-white font-bold border-b-2 border-slate-950 dark:border-white pb-1 hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-all duration-300"
                    href="#">儲值中心</a>
            </div>
            <div class="flex items-center space-x-6">
                <button
                    class="text-slate-900 dark:text-slate-100 flex items-center hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-all duration-300 p-2">
                    <span class="material-symbols-outlined">language</span>
                </button>
                <button
                    class="text-slate-900 dark:text-slate-100 font-bold hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-all duration-300 px-4 py-2 border border-slate-900 dark:border-white">
                    立即預約
                </button>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="flex-grow pt-32 pb-32 px-6 md:px-12 max-w-screen-xl mx-auto w-full relative z-10">
        <!-- Header -->
        <header class="mb-24 relative">
            <h1 class="text-5xl md:text-7xl font-headline font-black text-primary tracking-tight mb-4 leading-tight">
                元寶兌換
            </h1>
            <p class="text-xl md:text-2xl text-on-surface-variant font-body font-normal">
                充盈氣血，笑傲江湖。
            </p>
            <div class="absolute -top-12 -right-24 opacity-10 pointer-events-none hidden md:block">
                <span class="material-symbols-outlined text-[200px]"
                    style="font-variation-settings: 'FILL' 1;">cloud</span>
            </div>
        </header>
        <!-- Account Info Section -->
        <section
            class="mb-24 bg-surface-container-lowest p-8 md:p-12 relative overflow-hidden group hover:shadow-[0_20px_60px_-15px_rgba(25,28,30,0.06)] transition-shadow duration-500">
            <div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-low opacity-50 z-0"></div>
            <div
                class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-8 border-b border-outline-variant/15 pb-8">
                <div>
                    <h2 class="text-sm font-label font-bold text-on-surface-variant tracking-widest uppercase mb-2">當前帳號
                    </h2>
                    <p class="text-2xl font-headline font-bold text-primary">踏雪尋梅 (ID: 884219)</p>
                </div>
                <div class="text-left md:text-right">
                    <h2 class="text-sm font-label font-bold text-on-surface-variant tracking-widest uppercase mb-2">當前餘額
                    </h2>
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-tertiary text-3xl"
                            style="font-variation-settings: 'FILL' 1;">monetization_on</span>
                        <span class="text-4xl font-headline font-black text-primary">1,250</span>
                        <span class="text-lg font-headline text-on-surface-variant mt-2">元寶</span>
                    </div>
                </div>
            </div>
        </section>
        <!-- Currency Packages -->
        <section class="mb-24">
            <h2 class="text-2xl font-headline font-bold text-primary mb-12 flex items-center gap-4">
                <span class="w-12 h-px bg-primary/20"></span>
                選擇面額
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Package 1 -->
                <button
                    class="group bg-surface-container-lowest p-8 text-left border border-outline-variant/15 hover:border-primary transition-all duration-300 relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2">
                    <div
                        class="absolute top-0 right-0 w-24 h-24 bg-surface-container-low -mr-12 -mt-12 rounded-full transition-transform group-hover:scale-150 duration-500">
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-6 text-on-surface-variant">
                            <span class="material-symbols-outlined"
                                style="font-variation-settings: 'FILL' 1;">work</span>
                        </div>
                        <h3 class="text-xl font-headline font-bold text-primary mb-2">初學行囊</h3>
                        <div class="flex items-end gap-2 mb-8">
                            <span class="text-4xl font-headline font-black text-tertiary">300</span>
                            <span class="text-sm font-headline text-on-surface-variant mb-1">元寶</span>
                        </div>
                        <div class="text-lg font-label font-bold text-primary mt-auto">
                            NT$ 150
                        </div>
                    </div>
                </button>
                <!-- Package 2 -->
                <button
                    class="group bg-surface-container-lowest p-8 text-left border border-outline-variant/15 hover:border-primary transition-all duration-300 relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2">
                    <div
                        class="absolute top-0 right-0 w-24 h-24 bg-surface-container-low -mr-12 -mt-12 rounded-full transition-transform group-hover:scale-150 duration-500">
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-6 text-on-surface-variant">
                            <span class="material-symbols-outlined"
                                style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
                        </div>
                        <h3 class="text-xl font-headline font-bold text-primary mb-2">宗師寶匣</h3>
                        <div class="flex items-end gap-2 mb-8">
                            <span class="text-4xl font-headline font-black text-tertiary">1980</span>
                            <span class="text-sm font-headline text-on-surface-variant mb-1">元寶</span>
                        </div>
                        <div class="text-lg font-label font-bold text-primary mt-auto">
                            NT$ 990
                        </div>
                    </div>
                    <!-- Most Popular Badge -->
                    <div
                        class="absolute top-4 right-4 bg-tertiary text-on-tertiary text-xs font-label font-bold px-3 py-1 tracking-wider uppercase z-20">
                        推薦
                    </div>
                </button>
                <!-- Package 3 -->
                <button
                    class="group bg-surface-container-lowest p-8 text-left border border-outline-variant/15 hover:border-primary transition-all duration-300 relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2">
                    <div
                        class="absolute top-0 right-0 w-24 h-24 bg-surface-container-low -mr-12 -mt-12 rounded-full transition-transform group-hover:scale-150 duration-500">
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-6 text-on-surface-variant">
                            <span class="material-symbols-outlined"
                                style="font-variation-settings: 'FILL' 1;">diamond</span>
                        </div>
                        <h3 class="text-xl font-headline font-bold text-primary mb-2">帝王秘藏</h3>
                        <div class="flex items-end gap-2 mb-8">
                            <span class="text-4xl font-headline font-black text-tertiary">6480</span>
                            <span class="text-sm font-headline text-on-surface-variant mb-1">元寶</span>
                        </div>
                        <div class="text-lg font-label font-bold text-primary mt-auto">
                            NT$ 3290
                        </div>
                    </div>
                </button>
            </div>
        </section>
        <!-- Payment Methods -->
        <section class="mb-24">
            <h2 class="text-2xl font-headline font-bold text-primary mb-8 flex items-center gap-4">
                <span class="w-12 h-px bg-primary/20"></span>
                支付方式
            </h2>
            <div class="space-y-12">
                <!-- Domestic Payment -->
                <div>
                    <h3 class="text-lg font-headline font-bold text-primary mb-6 border-l-4 border-tertiary pl-4">國內支付
                    </h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Credit Card -->
                        <label
                            class="relative flex flex-col items-center justify-center p-6 border border-outline-variant/15 bg-white hover:border-primary cursor-pointer transition-all duration-300 group">
                            <input checked="" class="peer sr-only" name="payment_method" type="radio" />
                            <div
                                class="absolute inset-0 border-2 border-transparent peer-checked:border-primary transition-all duration-300">
                            </div>
                            <span
                                class="material-symbols-outlined text-3xl mb-3 text-on-surface-variant group-hover:text-primary peer-checked:text-primary transition-colors">credit_card</span>
                            <span class="text-sm font-headline font-bold text-primary">信用卡</span>
                        </label>
                        <!-- Bank Transfer -->
                        <label
                            class="relative flex flex-col items-center justify-center p-6 border border-outline-variant/15 bg-white hover:border-primary cursor-pointer transition-all duration-300 group">
                            <input class="peer sr-only" name="payment_method" type="radio" />
                            <div
                                class="absolute inset-0 border-2 border-transparent peer-checked:border-primary transition-all duration-300">
                            </div>
                            <span
                                class="material-symbols-outlined text-3xl mb-3 text-on-surface-variant group-hover:text-primary peer-checked:text-primary transition-colors">account_balance</span>
                            <span class="text-sm font-headline font-bold text-primary">銀行轉帳</span>
                        </label>
                        <!-- Convenience Store -->
                        <label
                            class="relative flex flex-col items-center justify-center p-6 border border-outline-variant/15 bg-white hover:border-primary cursor-pointer transition-all duration-300 group">
                            <input class="peer sr-only" name="payment_method" type="radio" />
                            <div
                                class="absolute inset-0 border-2 border-transparent peer-checked:border-primary transition-all duration-300">
                            </div>
                            <span
                                class="material-symbols-outlined text-3xl mb-3 text-on-surface-variant group-hover:text-primary peer-checked:text-primary transition-colors">storefront</span>
                            <span class="text-sm font-headline font-bold text-primary">超商繳費</span>
                        </label>
                    </div>
                </div>
                <!-- Overseas Payment -->
                <div>
                    <h3 class="text-lg font-headline font-bold text-primary mb-6 border-l-4 border-tertiary pl-4">海外支付
                    </h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- PayPal -->
                        <label
                            class="relative flex flex-col items-center justify-center p-6 border border-outline-variant/15 bg-white hover:border-primary cursor-pointer transition-all duration-300 group">
                            <input class="peer sr-only" name="payment_method" type="radio" />
                            <div
                                class="absolute inset-0 border-2 border-transparent peer-checked:border-primary transition-all duration-300">
                            </div>
                            <span
                                class="material-symbols-outlined text-3xl mb-3 text-on-surface-variant group-hover:text-primary peer-checked:text-primary transition-colors">account_balance_wallet</span>
                            <span class="text-sm font-headline font-bold text-primary">PayPal</span>
                        </label>
                        <!-- Crypto -->
                        <div
                            class="relative flex flex-col items-center justify-center p-6 border border-outline-variant/15 bg-white hover:border-primary transition-all duration-300 group">
                            <input class="peer sr-only" id="pay_crypto_new" name="payment_method" type="radio" />
                            <label class="absolute inset-0 cursor-pointer z-10" for="pay_crypto_new">
                                <div
                                    class="absolute inset-0 border-2 border-transparent peer-checked:border-primary transition-all duration-300">
                                </div>
                            </label>
                            <span
                                class="material-symbols-outlined text-3xl mb-3 text-on-surface-variant group-hover:text-primary peer-checked:text-primary transition-colors">currency_bitcoin</span>
                            <span class="text-sm font-headline font-bold text-primary">虛擬貨幣</span>
                        </div>
                    </div>
                    <!-- Crypto Sub-menu -->
                    <div class="hidden bg-surface-container-lowest border border-outline-variant/15 p-6 mt-4 animate-in fade-in slide-in-from-top-2"
                        id="crypto_sub_menu">
                        <div
                            class="text-xs font-headline font-bold text-on-surface-variant uppercase tracking-widest mb-6 border-b border-outline-variant/10 pb-2">
                            選擇結算幣種</div>
                        <div class="flex gap-8">
                            <label class="flex items-center gap-3 cursor-pointer group/sub">
                                <input checked=""
                                    class="form-radio text-primary focus:ring-primary h-4 w-4 bg-transparent border-outline-variant/50"
                                    name="crypto_type" type="radio" />
                                <span
                                    class="text-sm font-headline font-bold text-primary group-hover/sub:text-tertiary transition-colors">BTC
                                    (Bitcoin)</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group/sub">
                                <input
                                    class="form-radio text-primary focus:ring-primary h-4 w-4 bg-transparent border-outline-variant/50"
                                    name="crypto_type" type="radio" />
                                <span
                                    class="text-sm font-headline font-bold text-primary group-hover/sub:text-tertiary transition-colors">ETC
                                    (Ethereum Classic)</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group/sub">
                                <input
                                    class="form-radio text-primary focus:ring-primary h-4 w-4 bg-transparent border-outline-variant/50"
                                    name="crypto_type" type="radio" />
                                <span
                                    class="text-sm font-headline font-bold text-primary group-hover/sub:text-tertiary transition-colors">USDT
                                    (Tether)</span>
                            </label>
                        </div>
                    </div>
                    <style>
                        body:has(#pay_crypto_new:checked) #crypto_sub_menu {
                            display: block !important;
                        }
                    </style>
                </div>
            </div>
        </section>
        <!-- Submit Section -->
        <div class="mt-16 text-center md:text-right mt-8">
            <p class="text-sm font-body text-on-surface-variant mb-6">點擊確認即表示您同意 <a
                    class="text-primary underline hover:text-tertiary transition-colors" href="#">服務條款</a> 與 <a
                    class="text-primary underline hover:text-tertiary transition-colors" href="#">退款政策</a></p>
            <button
                class="bg-tertiary text-on-tertiary font-headline font-bold text-xl py-5 px-16 hover:bg-tertiary-container transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-surface-tint focus:ring-offset-2 w-full md:w-auto shadow-[0_10px_40px_-10px_rgba(61,0,9,0.3)] hover:shadow-[0_15px_50px_-10px_rgba(61,0,9,0.4)]">
                確認儲值
            </button>
        </div>
    </main>
    <!-- Footer -->
    <footer
        class="w-full py-20 px-12 border-t border-slate-200/10 bg-slate-100 dark:bg-slate-950 font-noto-serif text-sm tonal shifts with vast negative space flat flex flex-col md:flex-row justify-between items-start gap-8 max-w-screen-2xl mx-auto">
        <div class="text-xl font-black text-slate-900 dark:text-slate-100">
            墨雪巔 (The Silent Peak)
        </div>
        <div class="flex flex-col md:flex-row gap-6">
            <a class="text-slate-500 dark:text-slate-500 hover:text-red-900 dark:hover:text-red-400 transition-colors"
                href="#">隱私政策</a>
            <a class="text-slate-500 dark:text-slate-500 hover:text-red-900 dark:hover:text-red-400 transition-colors"
                href="#">服務條款</a>
            <a class="text-slate-500 dark:text-slate-500 hover:text-red-900 dark:hover:text-red-400 transition-colors"
                href="#">家長導引</a>
            <a class="text-slate-500 dark:text-slate-500 hover:text-red-900 dark:hover:text-red-400 transition-colors"
                href="#">聯繫我們</a>
        </div>
        <div class="text-slate-600 dark:text-slate-400">
            © 2024 墨雪巔製作委員會. 版權所有.
        </div>
    </footer>
</body>

</html>
