<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>預約服務 - 選擇項目</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6a3523",
                        "surface-variant": "#e5e2e0",
                        "on-primary-fixed-variant": "#73351e",
                        "surface-container-low": "#f6f3f1",
                        "on-surface": "#1b1c1b",
                        "secondary": "#685c53",
                        "on-secondary-fixed-variant": "#4f453c",
                        "outline-variant": "#d9c2ba",
                        "background": "#fcf9f7",
                        "surface-container-lowest": "#ffffff"
                    },
                    fontFamily: {
                        "noto-serif": ["Noto Serif TC", "serif"],
                        "manrope": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
    <header class="fixed top-0 w-full z-50 bg-[#fcf9f7]/90 backdrop-blur-md flex items-center px-6 h-14 border-b border-surface-variant/30">
        <div class="flex items-center gap-3 w-full max-w-2xl mx-auto">
            <span class="material-symbols-outlined text-primary cursor-pointer hover:opacity-80 transition-opacity" data-icon="arrow_back">arrow_back</span>
            <h1 class="font-noto-serif text-lg font-bold tracking-wider text-primary">預約服務</h1>
        </div>
    </header>

    <main class="flex-1 mt-16 px-5 pb-32 max-w-2xl mx-auto w-full">
        <div class="mb-6 flex flex-col gap-1">
            <div class="flex items-center gap-2">
                <span class="flex items-center justify-center w-5 h-5 rounded-full bg-primary text-white text-[10px] font-bold">1</span>
                <h2 class="font-noto-serif text-xl font-bold tracking-wide text-on-surface">選擇專屬美容師</h2>
            </div>
            <p class="text-on-surface-variant text-xs ml-7">請先選擇您偏好的美容師，我們將為您規劃專屬服務。</p>
        </div>

        <div class="space-y-3 mb-10 ml-7">
            <label class="group relative block cursor-pointer">
                <input class="peer hidden" name="beautician" type="radio" value="ariel"/>
                <div class="p-3 bg-surface-container-low rounded-2xl transition-all duration-300 border border-transparent peer-checked:border-primary peer-checked:bg-white peer-checked:shadow-sm hover:bg-surface-variant/20">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full overflow-hidden shrink-0 border border-surface-variant">
                                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=150&q=80" alt="Ariel" class="w-full h-full object-cover"/>
                            </div>
                            <div>
                                <h3 class="font-noto-serif text-sm font-bold text-on-surface">Ariel <span class="text-[10px] font-normal text-primary bg-primary/10 px-1.5 py-0.5 rounded-md ml-1">店長</span></h3>
                                <p class="text-on-surface-variant text-xs mt-0.5 line-clamp-1">擅長客製化眼型調整與柔霧眉設計</p>
                            </div>
                        </div>
                        <div class="w-5 h-5 shrink-0 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
                            <div class="w-1.5 h-1.5 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
                        </div>
                    </div>
                </div>
            </label>

            <label class="group relative block cursor-pointer">
                <input class="peer hidden" name="beautician" type="radio" value="bella"/>
                <div class="p-3 bg-surface-container-low rounded-2xl transition-all duration-300 border border-transparent peer-checked:border-primary peer-checked:bg-white peer-checked:shadow-sm hover:bg-surface-variant/20">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full overflow-hidden shrink-0 border border-surface-variant">
                                <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=150&q=80" alt="Bella" class="w-full h-full object-cover"/>
                            </div>
                            <div>
                                <h3 class="font-noto-serif text-sm font-bold text-on-surface">Bella <span class="text-[10px] font-normal text-secondary bg-secondary/10 px-1.5 py-0.5 rounded-md ml-1">資深技師</span></h3>
                                <p class="text-on-surface-variant text-xs mt-0.5 line-clamp-1">專精極致深層美膚與臉部撥筋</p>
                            </div>
                        </div>
                        <div class="w-5 h-5 shrink-0 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
                            <div class="w-1.5 h-1.5 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
                        </div>
                    </div>
                </div>
            </label>

            <label class="group relative block cursor-pointer">
                <input class="peer hidden" name="beautician" type="radio" value="chloe"/>
                <div class="p-3 bg-surface-container-low rounded-2xl transition-all duration-300 border border-transparent peer-checked:border-primary peer-checked:bg-white peer-checked:shadow-sm hover:bg-surface-variant/20">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full overflow-hidden shrink-0 border border-surface-variant">
                                <img src="https://images.unsplash.com/photo-1548142813-c348350df52b?auto=format&fit=crop&w=150&q=80" alt="Chloe" class="w-full h-full object-cover"/>
                            </div>
                            <div>
                                <h3 class="font-noto-serif text-sm font-bold text-on-surface">Chloe <span class="text-[10px] font-normal text-secondary bg-secondary/10 px-1.5 py-0.5 rounded-md ml-1">美容師</span></h3>
                                <p class="text-on-surface-variant text-xs mt-0.5 line-clamp-1">主打清新自然系嫁接與溫和淨膚</p>
                            </div>
                        </div>
                        <div class="w-5 h-5 shrink-0 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
                            <div class="w-1.5 h-1.5 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
                        </div>
                    </div>
                </div>
            </label>
        </div>

        <div id="service-section" class="hidden opacity-0 transition-opacity duration-500">
            <div class="mb-4 flex flex-col gap-1">
                <div class="flex items-center gap-2">
                    <span class="flex items-center justify-center w-5 h-5 rounded-full bg-primary text-white text-[10px] font-bold">2</span>
                    <h2 class="font-noto-serif text-xl font-bold tracking-wide text-on-surface">選擇服務類別</h2>
                </div>
                <p class="text-on-surface-variant text-xs ml-7">請選擇您今日想要體驗的療程產品。</p>
            </div>
            
            <div class="space-y-3 ml-7">
                <label class="group relative block cursor-pointer">
                    <input class="peer hidden" name="service" type="radio"/>
                    <div class="p-4 bg-surface-container-low rounded-2xl transition-all duration-300 border border-transparent peer-checked:border-primary peer-checked:bg-white peer-checked:shadow-sm hover:bg-surface-variant/20">
                        <div class="flex items-center justify-between gap-4">
                            <div class="flex items-center gap-3 w-full">
                                <div class="w-10 h-10 shrink-0 rounded-xl bg-surface-container-highest flex items-center justify-center text-primary peer-checked:bg-primary/10">
                                    <span class="material-symbols-outlined text-[22px]" data-icon="visibility">visibility</span>
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-noto-serif text-base font-bold text-on-surface">美睫 (Eyelash)</h3>
                                    <p class="text-on-surface-variant text-xs mt-0.5 leading-snug">專業嫁接技術，打造自然如真或濃密亮眼的迷人雙眸。</p>
                                </div>
                            </div>
                            <div class="w-5 h-5 shrink-0 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
                                <div class="w-1.5 h-1.5 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
                            </div>
                        </div>
                    </div>
                </label>

                <label class="group relative block cursor-pointer">
                    <input class="peer hidden" name="service" type="radio"/>
                    <div class="p-4 bg-surface-container-low rounded-2xl transition-all duration-300 border border-transparent peer-checked:border-primary peer-checked:bg-white peer-checked:shadow-sm hover:bg-surface-variant/20">
                        <div class="flex items-center justify-between gap-4">
                            <div class="flex items-center gap-3 w-full">
                                <div class="w-10 h-10 shrink-0 rounded-xl bg-surface-container-highest flex items-center justify-center text-primary peer-checked:bg-primary/10">
                                    <span class="material-symbols-outlined text-[22px]" data-icon="brush">brush</span>
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-noto-serif text-base font-bold text-on-surface">霧眉 (Microblading)</h3>
                                    <p class="text-on-surface-variant text-xs mt-0.5 leading-snug">半永久定妝技術，根據您的面部比例設計專屬自然眉型。</p>
                                </div>
                            </div>
                            <div class="w-5 h-5 shrink-0 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
                                <div class="w-1.5 h-1.5 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
                            </div>
                        </div>
                    </div>
                </label>

                <label class="group relative block cursor-pointer">
                    <input class="peer hidden" name="service" type="radio"/>
                    <div class="p-4 bg-surface-container-low rounded-2xl transition-all duration-300 border border-transparent peer-checked:border-primary peer-checked:bg-white peer-checked:shadow-sm hover:bg-surface-variant/20">
                        <div class="flex items-center justify-between gap-4">
                            <div class="flex items-center gap-3 w-full">
                                <div class="w-10 h-10 shrink-0 rounded-xl bg-surface-container-highest flex items-center justify-center text-primary peer-checked:bg-primary/10">
                                    <span class="material-symbols-outlined text-[22px]" data-icon="spa">spa</span>
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-noto-serif text-base font-bold text-on-surface">美膚 (Skincare)</h3>
                                    <p class="text-on-surface-variant text-xs mt-0.5 leading-snug">深層清潔與極致養護，讓肌膚重現如同瓷器般的透亮光澤。</p>
                                </div>
                            </div>
                            <div class="w-5 h-5 shrink-0 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors">
                                <div class="w-1.5 h-1.5 rounded-full bg-white opacity-0 peer-checked:opacity-100"></div>
                            </div>
                        </div>
                    </div>
                </label>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-md z-40 pb-8 pt-4 px-6 border-t border-surface-variant/30">
        <div class="max-w-2xl mx-auto flex flex-col gap-4">
            <button id="next-btn" onclick="window.location.href='2.html'" disabled class="w-full h-12 bg-primary text-white rounded-xl font-manrope font-bold text-base flex items-center justify-center gap-2 shadow-sm hover:opacity-90 transition-all active:scale-[0.98] duration-300 opacity-50 cursor-not-allowed">
                確認選擇，下一步
                <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const beauticianInputs = document.querySelectorAll('input[name="beautician"]');
            const serviceInputs = document.querySelectorAll('input[name="service"]');
            const serviceSection = document.getElementById('service-section');
            const nextBtn = document.getElementById('next-btn');

            function updateNextBtn() {
                const bChecked = document.querySelector('input[name="beautician"]:checked');
                const sChecked = document.querySelector('input[name="service"]:checked');
                
                if (bChecked && sChecked) {
                    nextBtn.disabled = false;
                    nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }

            beauticianInputs.forEach(input => {
                input.addEventListener('change', () => {
                    serviceSection.classList.remove('hidden');
                    
                    setTimeout(() => {
                        serviceSection.classList.remove('opacity-0');
                        serviceSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 50);
                    
                    updateNextBtn();
                });
            });

            serviceInputs.forEach(input => {
                input.addEventListener('change', updateNextBtn);
            });
        });
    </script>
</body>
</html>
