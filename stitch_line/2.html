<!DOCTYPE html>

<style>

<body class="bg-surface font-body text-on-surface selection:bg-primary/20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fcf9f7] dark:bg-stone-950 flex items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#88452d] dark:text-[#a65d43] cursor-pointer" data-icon="arrow_back">arrow_back</span>

</div>
</header>

<div class="mb-10 flex flex-col gap-2">

</div>

<div class="flex gap-4">
<button class="p-2 rounded-full hover:bg-surface-container transition-colors">

</button>
<button class="p-2 rounded-full hover:bg-surface-container transition-colors">

</button>
</div>
</div>

<div class="text-outline/40 py-3 text-sm">24</div>

<div class="text-on-surface py-3 text-sm cursor-pointer hover:bg-surface-container rounded-xl transition-all">19</div>

<span class="text-[10px] uppercase tracking-wider text-on-surface-variant font-bold">預約確認</span>
<span class="text-sm font-bold text-primary">12月12日 14:00</span>
</div>
<button onclick="window.location.href='3.html'" class="text-white px-8 py-4 rounded-xl font-bold text-sm tracking-widest hover:opacity-90 active:scale-95 transition-all duration-400" style="background: linear-gradient(135deg, #5D2E1E 0%, #6A3523 100%);">

</div>
</div>

<div class="flex flex-col items-center justify-center text-stone-500 dark:text-stone-400 px-6 py-2 transition-transform duration-400 hover:text-[#88452d]">
