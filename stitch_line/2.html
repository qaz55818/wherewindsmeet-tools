<!DOCTYPE html>
<html class="light" lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>預約服務 - 選擇日期與時間</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#88452d",
                        "surface-variant": "#e5e2e0",
                        "on-primary-fixed-variant": "#73351e",
                        "surface-container-low": "#f6f3f1",
                        "on-surface": "#1b1c1b",
                        "secondary": "#685c53",
                        "on-secondary-fixed-variant": "#4f453c",
                        "on-tertiary-container": "#fff4ee",
                        "tertiary-fixed": "#f3dfd1",
                        "background": "#fcf9f7",
                        "surface-container": "#f0edeb",
                        "outline-variant": "#d9c2ba",
                        "on-secondary-container": "#6c6057",
                        "inverse-on-surface": "#f3f0ee",
                        "surface-container-highest": "#e5e2e0",
                        "tertiary-container": "#7d6e63",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#390c00",
                        "secondary-fixed-dim": "#d3c4b8",
                        "on-background": "#1b1c1b",
                        "surface-container-high": "#eae8e6",
                        "on-secondary": "#ffffff",
                        "surface": "#fcf9f7",
                        "primary-container": "#a65d43",
                        "error-container": "#ffdad6",
                        "surface-tint": "#904b33",
                        "on-surface-variant": "#54433e",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#fff4f0",
                        "surface-dim": "#dcd9d8",
                        "secondary-container": "#edddd1",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#221a13",
                        "outline": "#86736d",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#ffb59c",
                        "surface-bright": "#fcf9f7",
                        "primary-fixed": "#ffdbcf",
                        "tertiary-fixed-dim": "#d6c3b6",
                        "inverse-surface": "#31302f",
                        "on-tertiary-fixed": "#241a11",
                        "error": "#ba1a1a",
                        "tertiary": "#64564b",
                        "primary-fixed-dim": "#ffb59c",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#51443a",
                        "secondary-fixed": "#f0e0d4"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Noto Serif TC", "serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .font-noto-serif { font-family: 'Noto Serif TC', serif; }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: max(884px, 100dvh);
            -webkit-font-smoothing: antialiased;
        }
        
        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary/20 flex flex-col min-h-screen">

    <header class="fixed top-0 w-full z-50 bg-[#fcf9f7]/90 backdrop-blur-md border-b border-surface-variant/30 flex items-center px-6 h-14">
        <div class="flex items-center gap-3 w-full max-w-2xl mx-auto">
            <span class="material-symbols-outlined text-primary cursor-pointer hover:opacity-80 transition-opacity" data-icon="arrow_back" onclick="history.back()">arrow_back</span>
            <h1 class="font-noto-serif text-lg font-bold tracking-wider text-primary">預約服務</h1>
        </div>
    </header>

    <main class="flex-1 mt-16 px-5 pb-40 max-w-2xl mx-auto w-full">
        <div class="mb-6 flex flex-col gap-1 mt-4">
            <div class="flex items-center gap-2">
                <span class="flex items-center justify-center w-5 h-5 rounded-full bg-primary text-white text-[10px] font-bold">2</span>
                <h2 class="font-headline text-xl font-bold tracking-wide text-on-surface">選擇日期與時間</h2>
            </div>
            <p class="text-on-surface-variant text-xs ml-7">請挑選您理想的服務時段，我們將為您保留名額。</p>
        </div>

        <section class="mb-6 p-5 rounded-3xl bg-surface-container-low shadow-sm transition-all duration-400">
            <div class="flex justify-between items-center mb-6 px-2">
                <h3 id="current-month-display" class="font-headline text-lg font-bold text-on-surface">2024年 5月</h3>
                <div class="flex gap-2">
                    <button class="p-1.5 rounded-full hover:bg-surface-variant/50 transition-colors">
                        <span class="material-symbols-outlined text-secondary" data-icon="chevron_left">chevron_left</span>
                    </button>
                    <button class="p-1.5 rounded-full hover:bg-surface-variant/50 transition-colors">
                        <span class="material-symbols-outlined text-secondary" data-icon="chevron_right">chevron_right</span>
                    </button>
                </div>
            </div>
            
            <div class="grid grid-cols-7 gap-y-2 text-center mb-2">
                <div class="text-on-surface-variant text-[10px] font-bold">日</div>
                <div class="text-on-surface-variant text-[10px] font-bold">一</div>
                <div class="text-on-surface-variant text-[10px] font-bold">二</div>
                <div class="text-on-surface-variant text-[10px] font-bold">三</div>
                <div class="text-on-surface-variant text-[10px] font-bold">四</div>
                <div class="text-on-surface-variant text-[10px] font-bold">五</div>
                <div class="text-on-surface-variant text-[10px] font-bold">六</div>
            </div>

            <div id="calendar-grid" class="grid grid-cols-7 gap-y-2 gap-x-1 text-center">
                </div>
        </section>

        <div id="status-message-container" class="hidden mb-6 px-2">
            <div id="status-box" class="flex items-center gap-3 p-4 rounded-2xl">
                <span id="status-icon" class="material-symbols-outlined text-2xl"></span>
                <div class="flex flex-col">
                    <span id="status-title" class="font-bold text-sm"></span>
                    <span id="status-desc" class="text-xs mt-0.5"></span>
                </div>
            </div>
        </div>

        <div id="time-slots-section" class="space-y-6 hidden transition-all duration-500 opacity-0 ml-2">
            <div>
                <div class="flex items-center gap-2 mb-3">
                    <span class="material-symbols-outlined text-primary text-sm" data-icon="light_mode">light_mode</span>
                    <h4 class="font-headline font-bold text-sm">上午時段</h4>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all">09:00</button>
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all">10:00</button>
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all disabled:opacity-30 disabled:cursor-not-allowed" disabled>11:00</button>
                </div>
            </div>

            <div>
                <div class="flex items-center gap-2 mb-3">
                    <span class="material-symbols-outlined text-primary text-sm" data-icon="wb_sunny">wb_sunny</span>
                    <h4 class="font-headline font-bold text-sm">下午時段</h4>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all">13:00</button>
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all">14:00</button>
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all">15:00</button>
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all disabled:opacity-30 disabled:cursor-not-allowed" disabled>16:00</button>
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all">17:00</button>
                </div>
            </div>

            <div class="pb-8">
                <div class="flex items-center gap-2 mb-3">
                    <span class="material-symbols-outlined text-primary text-sm" data-icon="dark_mode">dark_mode</span>
                    <h4 class="font-headline font-bold text-sm">晚間時段</h4>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all disabled:opacity-30 disabled:cursor-not-allowed" disabled>19:00</button>
                    <button class="time-btn bg-white border border-surface-variant text-on-surface-variant px-5 py-2.5 rounded-xl text-sm font-medium hover:border-primary hover:text-primary transition-all">20:00</button>
                </div>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-md z-40 pb-8 pt-4 px-6 border-t border-surface-variant/30">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex flex-col">
                <span class="text-[10px] text-on-surface-variant font-medium">目前選擇</span>
                <span id="selected-summary" class="text-sm font-bold text-on-surface">尚未選擇時段</span>
            </div>
            
            <button id="next-btn" onclick="window.location.href='3.html'" disabled class="bg-primary text-white px-8 py-3.5 rounded-xl font-manrope font-bold text-sm flex items-center justify-center gap-2 shadow-sm hover:opacity-90 transition-all active:scale-95 duration-300 opacity-50 cursor-not-allowed">
                確認預約
                <span class="material-symbols-outlined text-base" data-icon="arrow_forward">arrow_forward</span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const calendarGrid = document.getElementById('calendar-grid');
            const statusContainer = document.getElementById('status-message-container');
            const statusBox = document.getElementById('status-box');
            const statusIcon = document.getElementById('status-icon');
            const statusTitle = document.getElementById('status-title');
            const statusDesc = document.getElementById('status-desc');
            const timeSlotsSection = document.getElementById('time-slots-section');
            const timeBtns = document.querySelectorAll('.time-btn:not([disabled])');
            const selectedSummary = document.getElementById('selected-summary');
            const nextBtn = document.getElementById('next-btn');

            let selectedDateObj = null;
            let selectedTimeStr = null;

            // 模擬當前月份與日期 (以 2024 年 5 月為例)
            const year = 2024;
            const month = 5; // 5月
            document.getElementById('current-month-display').textContent = `${year}年 ${month}月`;

            // 模擬日期狀態資料庫 (1=可預約, 2=已被預約, 3=不可預約/休假)
            // 這裡隨機設定一些狀態供展示
            const dateStatuses = {
                12: 1, 13: 1, 14: 2, 15: 3, 16: 1, 17: 2, 18: 1, 19: 1, 20: 3, 21: 1, 22: 1
            };

            // 建立日曆 (簡化版，固定顯示 30 天)
            function renderCalendar() {
                // 填充上個月的空白 (假設 5/1 是星期三)
                for(let i=0; i<3; i++) {
                    const div = document.createElement('div');
                    div.className = 'text-outline/40 py-2.5 text-sm';
                    div.textContent = 28 + i;
                    calendarGrid.appendChild(div);
                }

                // 填充本月
                for (let day = 1; day <= 31; day++) {
                    const div = document.createElement('div');
                    
                    // 模擬 1~11 號已過去
                    if (day < 12) {
                        div.className = 'text-outline/40 py-2.5 text-sm cursor-not-allowed';
                        div.textContent = day;
                    } else {
                        const status = dateStatuses[day] || 1; // 預設為可預約
                        
                        div.className = 'date-btn relative py-2.5 text-sm cursor-pointer hover:bg-surface-variant/40 rounded-xl transition-all flex flex-col items-center justify-center gap-0.5';
                        div.textContent = day;
                        div.dataset.day = day;
                        div.dataset.status = status;

                        // 加入狀態指示小圓點
                        const dot = document.createElement('span');
                        dot.className = 'w-1 h-1 rounded-full absolute bottom-1';
                        
                        if (status === 1) {
                            dot.classList.add('bg-green-500'); // 可預約
                        } else if (status === 2) {
                            dot.classList.add('bg-red-500'); // 已滿
                            div.classList.add('opacity-60');
                        } else if (status === 3) {
                            dot.classList.add('bg-gray-400'); // 休假
                            div.classList.add('opacity-60');
                        }
                        div.appendChild(dot);

                        div.addEventListener('click', () => handleDateClick(div, day, status));
                    }
                    calendarGrid.appendChild(div);
                }
            }

            function handleDateClick(element, day, status) {
                // 清除之前的選取樣式
                document.querySelectorAll('.date-btn').forEach(btn => {
                    btn.classList.remove('bg-primary', 'text-white', 'shadow-md', 'font-bold');
                    // 恢復 hover 效果
                    btn.classList.add('hover:bg-surface-variant/40');
                    const dot = btn.querySelector('span');
                    if(dot) dot.style.display = 'block'; // 顯示小圓點
                });

                // 套用新的選取樣式
                element.classList.remove('hover:bg-surface-variant/40');
                element.classList.add('bg-primary', 'text-white', 'shadow-md', 'font-bold');
                const dot = element.querySelector('span');
                if(dot) dot.style.display = 'none'; // 選中時隱藏小圓點

                selectedDateObj = { month, day };
                selectedTimeStr = null; // 重置時間
                updateSummary();
                resetTimeSelection();

                // 處理不同狀態的顯示
                statusContainer.classList.remove('hidden');
                statusBox.className = 'flex items-center gap-3 p-4 rounded-2xl transition-all';
                
                if (status === 1) {
                    // 可預約
                    statusBox.classList.add('bg-green-50', 'text-green-800');
                    statusIcon.textContent = 'check_circle';
                    statusTitle.textContent = '此日期可預約';
                    statusDesc.textContent = '請在下方選擇您期望的時段';
                    
                    // 顯示時間選擇區
                    timeSlotsSection.classList.remove('hidden');
                    setTimeout(() => {
                        timeSlotsSection.classList.remove('opacity-0');
                    }, 50);

                } else if (status === 2) {
                    // 已被預約
                    statusBox.classList.add('bg-red-50', 'text-red-800');
                    statusIcon.textContent = 'event_busy';
                    statusTitle.textContent = '時段已被預約';
                    statusDesc.textContent = '很抱歉，此日期已無空缺，請選擇其他日期';
                    hideTimeSlots();

                } else if (status === 3) {
                    // 不可預約 (休假)
                    statusBox.classList.add('bg-gray-100', 'text-gray-700');
                    statusIcon.textContent = 'block';
                    statusTitle.textContent = '店休 / 不可預約';
                    statusDesc.textContent = '本日非營業時間，請選擇其他日期';
                    hideTimeSlots();
                }
            }

            function hideTimeSlots() {
                timeSlotsSection.classList.add('opacity-0');
                setTimeout(() => {
                    timeSlotsSection.classList.add('hidden');
                }, 300);
            }

            function resetTimeSelection() {
                timeBtns.forEach(btn => {
                    btn.classList.remove('bg-primary', 'text-white', 'border-primary', 'shadow-md');
                    btn.classList.add('bg-white', 'text-on-surface-variant', 'border-surface-variant');
                });
            }

            // 處理時間點擊
            timeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    resetTimeSelection();
                    // 套用選中樣式
                    btn.classList.remove('bg-white', 'text-on-surface-variant', 'border-surface-variant');
                    btn.classList.add('bg-primary', 'text-white', 'border-primary', 'shadow-md');
                    
                    selectedTimeStr = btn.textContent;
                    updateSummary();
                });
            });

            // 更新底部狀態列
            function updateSummary() {
                if (selectedDateObj && selectedTimeStr) {
                    selectedSummary.textContent = `${selectedDateObj.month}月${selectedDateObj.day}日 ${selectedTimeStr}`;
                    selectedSummary.classList.add('text-primary');
                    nextBtn.disabled = false;
                    nextBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else if (selectedDateObj) {
                    selectedSummary.textContent = `${selectedDateObj.month}月${selectedDateObj.day}日 (請選擇時間)`;
                    selectedSummary.classList.remove('text-primary');
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    selectedSummary.textContent = '尚未選擇時段';
                    nextBtn.disabled = true;
                    nextBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }

            // 初始化
            renderCalendar();
        });
    </script>
</body>
</html>
